/* webpmesim.css — Website Physics Math Engineering Simulator. Original work; no attribution required. */

/* ================= themes ================= */

  --panel: rgba(8,26,48,.94); --panel-2: rgba(14,40,70,.96); --field: rgba(4,18,34,.9);

  --data: #fde68a; --geo: #38bdf8; --ok: #4ade80; --alert: #f87171;
  --c1: #38bdf8; --c2: #fbbf24; --c3: #4ade80; --c4: #f472b6; --c5: #a78bfa; --c6: #fb923c;
  --plot-bg: rgba(4,18,34,.75); --plot-grid: rgba(125,211,252,.16); --plot-axis: rgba(224,242,254,.65);
  --scene-bg: #0a223f; --scene-grid-1: #38bdf8; --scene-grid-2: #16406b; --scene-shadow: .35;
  --part: #e2e8f0; --part-metal: .55; --part-rough: .38; --part-edge: #0b2a4a; --part-edge-op: .55;
  --select: #00e5ff;
  --scene-grid-op: .5; --wire-mesh-op: 0; --plot-glow: 0;

}

  --panel: rgba(255,255,255,.97); --panel-2: #f6f8fa; --field: #ffffff;
  --border: #cfd6de; --border-hi: #1f4e79;
  --text: #111827; --text-dim: #4b5563; --accent: #1f4e79; --accent-ink: #ffffff;
  --data: #0f5f59; --geo: #1d4ed8; --ok: #15803d; --alert: #b91c1c;
  --c1: #1d4ed8; --c2: #c2410c; --c3: #15803d; --c4: #be185d; --c5: #6d28d9; --c6: #a16207;
  --plot-bg: #ffffff; --plot-grid: rgba(17,24,39,.10); --plot-axis: rgba(17,24,39,.70);
  --scene-bg: #eef1f4; --scene-grid-1: #94a3b8; --scene-grid-2: #d5dbe2; --scene-shadow: .18;
  --part: #b9c0c8; --part-metal: .6; --part-rough: .35; --part-edge: #1f2937; --part-edge-op: .5;
  --select: #0369a1;
  --caution: #b45309; --fam-1: #1d4ed8; --fam-2: #7c3aed; --fam-3: #be185d;
  --seg-off: rgba(17,24,39,.08); --seg-on: #15803d; --z1: #15803d; --z2: #b45309; --z3: #b91c1c;
  --f-ui: "Roboto", "Segoe UI", Arial, sans-serif; --f-mono: "Roboto Mono", Consolas, monospace; --f-head: "Roboto", Arial, sans-serif;

/* CRT — immersive phosphor operations console (original design).
   Colour jobs: orange = structure and primary traces, yellow = titles, green = live values and scope graticule,
   teal = geometry axes, red = alarms only. Parts render as neon wireframes with bloom over green polar rings. */
html[data-theme="crt"] {
  --bg: #000; --bg-grid-major: transparent; --bg-grid-minor: transparent;
  --panel: rgba(3,2,2,.93); --panel-2: #0a0605; --field: #040202;
  --border: rgba(255,92,54,.42); --border-hi: #ff6a3a; --rule: rgba(255,140,60,.14);
  --text: #f0dcc4; --text-dim: #a8876c; --accent: #ff8c1a; --accent-dim: #b65a14; --accent-ink: #000; --title: #ffd24a;
  --data: #3dff7a; --geo: #3fe6c8; --ok: #3dff7a; --alert: #ff2b2b; --caution: #ffc21a;
  --c1: #ff8c1a; --c2: #3dff7a; --c3: #3fe6c8; --c4: #ffd24a; --c5: #e24dff; --c6: #ff4d2e;
  --plot-bg: #000; --plot-style: scope; --plot-grid: rgba(61,255,122,.75); --plot-major: rgba(61,255,122,.42); --plot-axis: #ff8c1a; --plot-glow: 9;
  --fam-1: #ff3b2b; --fam-2: #e24dff; --fam-3: #3f7bff;
  --scene-bg: #010103; --scene-grid-1: #ffb347; --scene-grid-2: #a8560f; --scene-grid-op: .5; --scene-shadow: 0;
  --wire-1: #ff7a1a; --wire-2: #ffb000; --wire-3: #ff4d2e; --wire-4: #ffd35a; --wire-mesh-op: .3;
  --crt-ring: #2bff6a; --crt-axis: #3fe6c8;
  --part: #1b1f22; --part-metal: .1; --part-rough: .95; --part-edge: #ff7a1a; --part-edge-op: 1;
  --select: #3dff7a;
  --seg-off: rgba(61,255,122,.10); --seg-on: #3dff7a; --z1: #3dff7a; --z2: #ffc21a; --z3: #ff2b2b;
  --f-ui: "Share Tech Mono", "Roboto Mono", Consolas, monospace; --f-mono: "Share Tech Mono", "Roboto Mono", Consolas, monospace;
  --f-head: "Noto Serif Display", Georgia, serif; --f-stamp: "Saira Extra Condensed", "Arial Narrow", sans-serif;
  --head-weight: 800; --head-track: .18em; --head-squeeze: .8; --radius: 0;
}

/* ================= fluid type: everything is rem-based ================= */
html { font-size: clamp(13px, calc(.38vw + 9.6px), 20px); -webkit-text-size-adjust: 100%; }
@media (max-width: 820px) { html { font-size: clamp(14px, calc(1.2vw + 8.5px), 16px); } }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font: 400 1rem/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
body { background-image:
  linear-gradient(var(--bg-grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid-major) 1px, transparent 1px),
  linear-gradient(var(--bg-grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid-minor) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--border-hi); outline-offset: 1px; }
.katex { font-size: 1.08em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: .2rem 0; margin: .4rem 0; }

/* ================= CRT layer and console chrome: only in CRT theme ================= */
.wp-crt-scan, .wp-crt-sweep { display: none; }
html[data-theme="crt"] .wp-crt-scan { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.5) 2px 3px); opacity: .14;
  box-shadow: inset 0 0 140px 20px rgba(0,0,0,.65); }                                   /* scanlines + edge vignette */
html[data-theme="crt"] .wp-crt-sweep { display: block; position: fixed; left: 0; right: 0; top: -12vh; height: 12vh; z-index: 9001; pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(77,255,106,.018), transparent); animation: wp-sweep 8s linear infinite; }
@keyframes wp-sweep { to { transform: translateY(124vh); } }
@keyframes wp-flicker { 0%, 100% { opacity: 1; } 47% { opacity: .985; } 48% { opacity: 1; } 83% { opacity: .978; } 84% { opacity: 1; } }
@keyframes wp-blink { 50% { opacity: .2; } }
html[data-theme="crt"] body { background: radial-gradient(ellipse 120% 70% at 50% 115%, rgba(30,60,220,.22), transparent 70%), #000; }
html[data-theme="crt"] .wp-header, html[data-theme="crt"] .wp-rail, html[data-theme="crt"] .wp-win { animation: wp-flicker 6s steps(1) infinite; }

/* top bar: compressed serif mark, facility line, lamp, toolbar groups, ticker */
html[data-theme="crt"] .wp-header { background: #000; border-bottom: 1px solid var(--accent-dim); }
html[data-theme="crt"] .wp-bar { border-bottom: 1px solid var(--rule); }
html[data-theme="crt"] .wp-title-text { font-size: 1.55rem; color: var(--accent); text-shadow: 0 0 4px rgba(255,140,26,.6), 0 0 18px rgba(255,140,26,.25); }
html[data-theme="crt"] .wp-subtitle { text-transform: uppercase; letter-spacing: .16em; font-size: .6rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-facility { color: var(--accent); border-left-color: var(--rule); text-shadow: 0 0 6px rgba(255,140,26,.35); }
html[data-theme="crt"] .wp-status { border-left-color: var(--rule); text-shadow: 0 0 6px currentColor; }
html[data-theme="crt"] .wp-hud span { text-transform: uppercase; font-size: .6rem; letter-spacing: .14em; color: var(--accent-dim); }
html[data-theme="crt"] .wp-hud b { font-size: .82rem; text-shadow: 0 0 5px rgba(61,255,122,.55); }
html[data-theme="crt"] .wp-qbtn { color: var(--text-dim); letter-spacing: .16em; }
html[data-theme="crt"] .wp-qbtn:hover, html[data-theme="crt"] .wp-qbtn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent-dim); }
html[data-theme="crt"] .wp-toolbar { background: linear-gradient(#050302, #000); }
html[data-theme="crt"] .wp-tlabel { color: var(--accent); text-shadow: 0 0 5px rgba(255,140,26,.5); }
html[data-theme="crt"] .wp-tbtn { background: #0a0807; border-color: #2a201a; color: #b8a48e; }
html[data-theme="crt"] .wp-tbtn:hover { border-color: var(--accent-dim); color: var(--accent); }
html[data-theme="crt"] .wp-tbtn[aria-pressed="true"] { color: var(--title); border-color: var(--accent); background: rgba(255,140,26,.14); box-shadow: inset 0 0 8px rgba(255,140,26,.35); }
html[data-theme="crt"] .wp-ticker { color: var(--accent); text-shadow: 0 0 6px rgba(255,140,26,.45); }
/* left rail: numbered channels, amber active block */
html[data-theme="crt"] .wp-rail { background: #000; border-right: 1px solid var(--border); counter-reset: wp-ch; }
html[data-theme="crt"] .wp-rail .wp-group { color: var(--accent-dim); letter-spacing: .22em; border-bottom: 1px solid var(--rule); margin: 0 .3rem .2rem; padding-left: .25rem; }
html[data-theme="crt"] .wp-rail button.wp-nav { text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-rail button.wp-nav[data-win]::after { counter-increment: wp-ch; content: counter(wp-ch, decimal-leading-zero); margin-left: auto; font-size: .64rem; color: #4a4a44; }
html[data-theme="crt"] .wp-rail button.wp-nav:hover { color: var(--accent); background: none; border-color: var(--border); }
html[data-theme="crt"] .wp-rail button.wp-nav[aria-expanded="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
html[data-theme="crt"] .wp-rail button.wp-nav[aria-expanded="true"]::after { color: #000; }
html.wp-rail-mini[data-theme="crt"] .wp-rail button.wp-nav::after { display: none; }
@media (max-width: 820px) { html[data-theme="crt"] .wp-rail button.wp-nav::after { display: none; } }
html[data-theme="crt"] .wp-seg { border-color: var(--border); }
html[data-theme="crt"] .wp-seg button { text-transform: uppercase; letter-spacing: .1em; }

/* windows: registration corner ticks, status lamp, compressed serif title */
html[data-theme="crt"] .wp-win { background: rgba(3,3,4,.95); border-color: var(--border); }
html[data-theme="crt"] .wp-win::before, html[data-theme="crt"] .wp-win::after { content: ""; position: absolute; z-index: 2; width: .6rem; height: .6rem; border: 0 solid var(--accent); pointer-events: none; }
html[data-theme="crt"] .wp-win::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
html[data-theme="crt"] .wp-win::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
html[data-theme="crt"] .wp-win.is-top { border-color: rgba(255,154,46,.6); }
html[data-theme="crt"] .wp-win-head { background: #000; border-bottom: 1px solid var(--border); padding-left: .7rem; }
html[data-theme="crt"] .wp-win-head::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); flex: none; }
html[data-theme="crt"] .wp-win.is-top .wp-win-head::before { animation: wp-blink 1.2s steps(1) infinite; }
html[data-theme="crt"] .wp-win-title { font-size: .95rem; text-shadow: 0 0 4px rgba(255,154,46,.45); }
html[data-theme="crt"] .wp-win-head .wp-x { border-color: var(--border); }
html[data-theme="crt"] .wp-win-body { scrollbar-color: var(--accent-dim) #000; }

/* content: tiny amber labels, green data, sharp blocks */
html[data-theme="crt"] .wp-h { color: var(--accent); letter-spacing: .2em; font-size: .7rem; border-bottom: 1px solid var(--rule); padding-bottom: .25rem; }
html[data-theme="crt"] .wp-btn { text-transform: uppercase; letter-spacing: .1em; font-size: .74rem; background: #000; border-color: var(--border); }
html[data-theme="crt"] .wp-btn:hover { color: var(--accent); border-color: var(--accent); }
html[data-theme="crt"] .wp-btn.is-primary { background: var(--accent); color: #000; }
html[data-theme="crt"] .wp-card { background: #000; border-color: var(--rule); border-left: 2px solid var(--accent-dim); }
html[data-theme="crt"] .wp-card.is-live { border-color: rgba(77,255,106,.35); border-left-color: var(--ok); }
html[data-theme="crt"] .wp-card .katex-display, html[data-theme="crt"] .wp-tabpanel .katex-display { color: #e9ffe9; text-shadow: 0 0 6px rgba(77,255,106,.25); }
html[data-theme="crt"] .wp-card.is-live .katex { color: var(--data); text-shadow: 0 0 5px rgba(77,255,106,.35); }
html[data-theme="crt"] .wp-field output, html[data-theme="crt"] .wp-kv dd, html[data-theme="crt"] .wp-spec b, html[data-theme="crt"] .wp-table td.num { text-shadow: 0 0 4px rgba(77,255,106,.4); }
html[data-theme="crt"] .wp-field > span { text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-tabs { border-bottom-color: var(--border); gap: 0; }
html[data-theme="crt"] .wp-tabs button { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; border: 1px solid transparent; border-bottom: 0; }
html[data-theme="crt"] .wp-tabs button[aria-selected="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
html[data-theme="crt"] .wp-table th { color: var(--accent); border-bottom-color: var(--accent-dim); }
html[data-theme="crt"] .wp-table td { border-bottom-color: var(--rule); }
html[data-theme="crt"] .wp-pass, html[data-theme="crt"] .wp-fail { font-family: var(--f-stamp); font-size: .95rem; letter-spacing: .16em; }
html[data-theme="crt"] .wp-pass { color: var(--ok); text-shadow: 0 0 6px rgba(77,255,106,.5); }
html[data-theme="crt"] .wp-fail { color: var(--alert); text-shadow: 0 0 6px rgba(255,59,48,.6); animation: wp-blink 1s steps(1) infinite; }
html[data-theme="crt"] .wp-spec div { background: #000; border-color: var(--rule); }
html[data-theme="crt"] .wp-spec span, html[data-theme="crt"] .wp-kv dt { color: var(--accent-dim); }
html[data-theme="crt"] .wp-tree li.is-sel { outline-color: var(--accent); background: rgba(255,154,46,.08); }
html[data-theme="crt"] .wp-tree .wp-dot { background: var(--dot); box-shadow: 0 0 6px var(--dot); }
html[data-theme="crt"] .wp-legend, html[data-theme="crt"] .wp-readout { text-transform: none; }
html[data-theme="crt"] .wp-hint, html[data-theme="crt"] .wp-badge { background: #000; text-transform: uppercase; letter-spacing: .1em; font-size: .64rem; border-color: var(--rule); color: var(--accent-dim); }
html[data-theme="crt"] .wp-badge { color: var(--accent); }

/* notice: amber hazard band, stamp label, compressed serif title */
html[data-theme="crt"] .wp-modal { background: rgba(0,0,0,.78); }
html[data-theme="crt"] .wp-modal-card { background: #000; border: 1px solid var(--accent); position: relative; padding-top: 2rem; box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255,154,46,.12); }
html[data-theme="crt"] .wp-modal-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .6rem;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 .7rem, #000 .7rem 1.4rem); }
html[data-theme="crt"] .wp-modal-card .wp-eyebrow { display: inline-block; font-family: var(--f-stamp); font-size: .85rem; letter-spacing: .24em; color: var(--accent); border: 2px solid var(--accent); padding: .1rem .5rem 0; margin-bottom: .6rem; }
html[data-theme="crt"] .wp-modal-card h2 { font-size: 1.9rem; display: inline-block; transform: scaleX(var(--head-squeeze)); transform-origin: left center; white-space: nowrap; text-shadow: 0 0 6px rgba(255,154,46,.5); }
html[data-theme="crt"] .wp-modal-card p, html[data-theme="crt"] .wp-modal-card li { color: var(--text); }
html[data-theme="crt"] .wp-preview-bar { background: #000; border-bottom-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  html[data-theme="crt"] .wp-header, html[data-theme="crt"] .wp-rail, html[data-theme="crt"] .wp-win,
  html[data-theme="crt"] .wp-win-head::before, html[data-theme="crt"] .wp-fail { animation: none !important; }
}

/* ================= header ================= */
:root { --top-h: 5.3rem; }
.wp-header { position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); z-index: 50; display: flex; flex-direction: column;
  background: var(--panel); border-bottom: 1px solid var(--border); }
.wp-bar { flex: 1; display: flex; align-items: center; gap: 1.1rem; padding: 0 1rem; min-height: 0; border-bottom: 1px solid var(--border); }
.wp-brand { display: flex; flex-direction: column; justify-content: center; gap: .2rem; min-width: 0; flex: none; }
.wp-title-text { font: var(--head-weight) 1.15rem/1 var(--f-head); letter-spacing: var(--head-track); text-transform: uppercase; color: var(--accent);
  display: inline-block; transform: scaleX(var(--head-squeeze)); transform-origin: left center; white-space: nowrap; }
.wp-subtitle { font-size: .68rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 20rem; }
html[data-theme="crt"] .wp-ticker { text-transform: uppercase; }
.katex, .katex * { text-transform: none !important; letter-spacing: normal; }
.wp-facility { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; border-left: 1px solid var(--border); padding-left: 1.1rem; }
.wp-tele-primary { background: none !important; gap: 0 !important; border-width: 1px 0 0 1px !important; }
.wp-tcell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.wp-status { display: inline-flex; align-items: center; gap: .45rem; font: 700 .7rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ok); white-space: nowrap; border-left: 1px solid var(--border); padding-left: 1.1rem; }
.wp-status .wp-lamp, .wp-lampbox .wp-lamp { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; flex: none; display: inline-block; }
.wp-status[data-level="caution"] { color: var(--caution, #d97706); }
.wp-status[data-level="alert"] { color: var(--alert); } .wp-status[data-level="alert"] .wp-lamp { animation: wp-blink .8s steps(1) infinite; }
.wp-hud { margin-left: auto; display: flex; gap: 1.1rem; font: 500 .78rem/1 var(--f-mono); white-space: nowrap; overflow: hidden; }
.wp-hud span { color: var(--text-dim); } .wp-hud b { color: var(--data); font-weight: 500; font-variant-numeric: tabular-nums; }
.wp-quick { display: flex; gap: .3rem; flex: none; }
.wp-qbtn { border: 1px solid transparent; background: none; padding: .45rem .7rem; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--text-dim); border-radius: var(--radius); }
.wp-qbtn:hover, .wp-qbtn[aria-expanded="true"] { color: var(--accent); border-color: var(--border); }

/* ================= viewport ================= */

/* ================= analysis console components (all themes) ================= */

.wp-tagchip[data-k="d"] { background: var(--caution); } .wp-tagchip[data-k="e"] { background: var(--c5); } .wp-tagchip[data-k="x"] { background: var(--alert); color: #fff; }

/* consensus */

.wp-mode-kv { grid-template-columns: 1fr auto; row-gap: .5rem; }

/* ================= alert status (independent) ================= */

<script>
/* ===================== MODEL: in-line slider-crank (crank, connecting rod, piston) =====================
   Frame: crank axis = +Z through the origin, piston slides along +X, x = piston-pin position from the crank axis.
   Units: lengths mm, mass kg, speed rpm; SI for derived quantities (m/s, m/s^2, N, N·m, J). */
const R = String.raw;
const deg = Math.PI / 180;

/* ---- exact kinematics (one source of truth for animation, graphs, live values and checks) ---- */
const K = {
  L: (th, P) => Math.sqrt(P.l * P.l - (P.r * Math.sin(th)) ** 2),
  x: (th, P) => P.r * Math.cos(th) + K.L(th, P),                                                       // mm
  dx: (th, P) => { const s = Math.sin(th), c = Math.cos(th); return -P.r * s - P.r * P.r * s * c / K.L(th, P); },   // mm / rad
  ddx: (th, P) => { const s = Math.sin(th), c = Math.cos(th), L = K.L(th, P); return -P.r * c - P.r * P.r * Math.cos(2 * th) / L - P.r ** 4 * s * s * c * c / L ** 3; },
  phi: (th, P) => Math.asin(P.r * Math.sin(th) / P.l),                                                 // rad
  w: P => 2 * Math.PI * P.n / 60,                                                                      // rad/s
  v: (th, P) => K.dx(th, P) * K.w(P) / 1000,                                                           // m/s
  a: (th, P) => K.ddx(th, P) * K.w(P) ** 2 / 1000,                                                     // m/s^2
  aApprox: (th, P) => -P.r / 1000 * K.w(P) ** 2 * (Math.cos(th) + P.r / P.l * Math.cos(2 * th)),
  F: (th, P) => P.m * K.a(th, P),                                                                      // N, force the rod must apply to the reciprocating mass
  T: (th, P) => K.F(th, P) * K.dx(th, P) / 1000,                                                       // N·m, virtual work
  Tgeo: (th, P) => { const f = K.phi(th, P); return -K.F(th, P) * (P.r / 1000) * Math.sin(th + f) / Math.cos(f); },
};

    /* crankshaft: web with counterweight, main shaft, crank pin (rotates about z) */
    const crankSpin = api.group('crankSpin');
    const inside = (x, y) => Math.hypot(x, y) <= 26 || Math.hypot(x - r, y) <= 18 || (x >= 0 && x <= r && Math.abs(y) <= 17) ||
      (Math.hypot(x, y) <= cw && Math.abs(Math.atan2(y, -x)) <= 50 * deg);
    const web = api.mesh(G.extrude(G.starOutline(inside, 360, cw + 30, 0.05), 12, 'z', { holes: [{ x: 0, y: 0, r: 12 }, { x: r, y: 0, r: 10 }] }), { at: [0, 0, -16] });
    const shaft = api.mesh(G.cyl(12, 90, 'z'), { at: [0, 0, -55] });
    const pin = api.mesh(G.cyl(10, 31, 'z'), { at: [r, 0, -6.5] });
    const crank = api.group(); crank.add(web, shaft, pin); crankSpin.add(crank); api.add(crankSpin);
    api.part('crankshaft', crank, {
      name: 'Crankshaft', tag: 'P-03', material: 'Quenched and tempered steel C45', explode: [0, 0, -45], tone: 1.05, metal: 0.25,
      section: { axis: 'z', at: -16 },
      specs: { 'Throw': `${r.toFixed(0)} mm`, 'Main journal': 'Ø24 mm', 'Crank pin': 'Ø20 mm' },
      dims: [{ view: 'front', a: [0, 0, -10], b: [r, 0, -10], orient: 'h', off: -36 }, { view: 'front', dia: true, c: [r, 0, -10], r: 10, ang: 60 }, { view: 'front', dia: true, c: [0, 0, -10], r: 12, ang: 120 }],
      desc: 'Turns at constant angular speed $\\omega$ and carries the crank pin on a circle of radius $r$.',
      info: {
        role: 'Converts between rotation of the shaft and the circular motion of the crank pin $A=(r\\cos\\theta,\\ r\\sin\\theta)$.',
        steps: ['The shaft turns in the main bearing at $\\omega=2\\pi n/60$.', 'The crank pin moves on a circle of radius $r$ and drives the rod big end.', 'The counterweight opposite the pin balances the rotating mass.', 'The required torque $T(\\theta)$ alternates in sign; the flywheel supplies and absorbs it.'],
        mech: [['Torque by virtual work', R`<p>For an ideal, frictionless mechanism the input power equals the power delivered to the piston: $T\omega=F\,v$. With $v=\omega\,dx/d\theta$ this gives $$T=F\,\dfrac{dx}{d\theta}$$ without solving any joint forces.</p>`],
          ['Same result from the rod force', R`<p>The rod force $F_c=F/\cos\varphi$ acts at lever arm $r\sin(\theta+\varphi)$ about the crank axis, so $$T=-F\,\dfrac{r\sin(\theta+\varphi)}{\cos\varphi}.$$ This equals the virtual-work result because $\dfrac{dx}{d\theta}=-\dfrac{r\sin(\theta+\varphi)}{\cos\varphi}$, which the Validation window checks numerically.</p>`],
          ['Balancing', R`<p>A counterweight can balance the rotating mass completely. It can balance only part of the reciprocating mass, and only its first-order component $m_r r\omega^2\cos\theta$.</p>`]],
        math: [[R`T=F\,\dfrac{dx}{d\theta}=-F\,\dfrac{r\sin(\theta+\varphi)}{\cos\varphi}`, 'Crank torque needed to accelerate the reciprocating mass.'], [R`\oint T\,d\theta=0`, 'At constant speed the inertia torque does no net work per revolution.']],
        fail: ['Fillet fatigue at the pin/web junction: from alternating bending and torsion, causing a crack and fracture.', 'Journal wear: from poor lubrication, causing increased clearance and knock.'],
        build: ['Press-fit the pin and the shaft into the web, then grind the journals true.', 'Balance the web and counterweight dynamically.'],
      },
      live: (S, P) => [R`T=${fmt(S.F)}\times\dfrac{${fmt(K.dx(S.th, P), 2)}}{1000}=${fmt(S.T)}\ \text{N\,m}`],
    });

    /* flywheel on the shaft end */
    const fly = api.mesh(G.lathe([[12, -8], [22, -8], [22, -3], [Rf - 10, -3], [Rf - 10, -8], [Rf, -8], [Rf, 8], [Rf - 10, 8], [Rf - 10, 3], [22, 3], [22, 8], [12, 8]], 'z', 96), { at: [0, 0, -88] });
    const flyG = api.group(); flyG.add(fly); crankSpin.add(flyG);
    api.part('flywheel', flyG, {
      name: 'Flywheel', tag: 'P-04', material: 'Grey cast iron EN-GJL-250', explode: [0, 0, -110], tone: 0.9,
      section: { axis: 'x', at: 0 },
      specs: { 'Outside diameter': `Ø${(2 * Rf).toFixed(0)} mm`, 'Rim width': '16 mm' },
      dims: [{ view: 'front', dia: true, c: [0, 0, -80], r: Rf, ang: 35 }, { view: 'front', dia: true, c: [0, 0, -80], r: 12, ang: 150 }],
      desc: 'Stores kinetic energy so the crank speed stays nearly constant while $T(\\theta)$ alternates.',
      info: {
        role: 'Absorbs the positive and negative work of the alternating crank torque so that $\\omega$ fluctuates only slightly.',
        steps: ['While $T>0$ the flywheel gives up energy and slows a little.', 'While $T<0$ it absorbs energy and speeds up.', 'Over one revolution the net work of the inertia torque is zero.'],
        mech: [['Speed fluctuation', R`<p>If $\Delta E$ is the largest swing of $\int T\,d\theta$ within one revolution, the coefficient of speed fluctuation is $$C_s=\dfrac{\omega_{\max}-\omega_{\min}}{\bar\omega}=\dfrac{\Delta E}{I\bar\omega^2}.$$ A larger moment of inertia $I$ gives smoother rotation.</p>`]],
        math: [[R`C_s=\dfrac{\Delta E}{I\,\bar\omega^{2}}`, 'Flywheel sizing relation (small fluctuation).'], [R`I\approx\tfrac12 m\left(R_o^{2}+R_i^{2}\right)`, 'Rim-dominated estimate.']],
        fail: ['Burst: from overspeed, when hoop stress $\\sigma\\approx\\rho\\,v_{\\text{rim}}^2$ exceeds the strength.', 'Loose hub: from fretting under torque reversal.'],
        build: ['Turn the rim and the bore in one set-up; balance statically.'],
      },
      live: (S, P) => [R`\omega=\dfrac{2\pi\,${fmt(P.n, 0)}}{60}=${fmt(K.w(P), 2)}\ \text{rad/s}`],
    });

    /* connecting rod: single profile with big and small ends */
    const R1 = 18, R2 = 13, h1 = 10, h2 = 7, x1 = Math.sqrt(R1 * R1 - h1 * h1), x2 = l - Math.sqrt(R2 * R2 - h2 * h2), a1 = Math.atan2(h1, x1), a2 = Math.asin(h2 / R2);
    const rs = new THREE.Shape(); rs.moveTo(x1, h1); rs.lineTo(x2, h2); rs.absarc(l, 0, R2, Math.PI - a2, -(Math.PI - a2), true); rs.lineTo(x1, -h1); rs.absarc(0, 0, R1, -a1, a1, true);
    const rodPose = api.group('rodPose'), rodG = api.group();
    rodG.add(api.mesh(G.extrude(rs, 14, 'z', { holes: [{ x: 0, y: 0, r: 10 }, { x: l, y: 0, r: 9 }], curveSegments: 64 })));
    rodPose.add(rodG); api.add(rodPose);
    api.part('rod', rodG, {
      name: 'Connecting rod', tag: 'P-05', material: 'Forged steel 42CrMo4', explode: [0, 0, 45], tone: 1.12, metal: 0.2,
      section: { axis: 'z', at: 0 },
      specs: { 'Centre distance': `${l.toFixed(0)} mm`, 'Ratio': `$\\lambda=${(r / l).toFixed(3)}$`, 'Big end': 'Ø20 mm', 'Small end': 'Ø18 mm' },
      dims: [{ view: 'front', a: [0, 0, 7], b: [l, 0, 7], orient: 'h', off: -28 }, { view: 'front', dia: true, c: [0, 0, 7], r: 10, ang: 125 }, { view: 'front', dia: true, c: [l, 0, 7], r: 9, ang: 55 }],
      desc: 'Two-force member linking the crank pin $A$ to the piston pin $B$.',
      info: {
        role: 'Transmits force along its axis between the crank pin and the piston pin, and turns the circular motion of $A$ into the straight motion of $B$.',
        steps: ['The big end follows the crank pin around its circle.', 'The small end moves with the piston along $x$.', 'The rod swings through $\\pm\\varphi_{\\max}$ with $\\sin\\varphi=\\lambda\\sin\\theta$.'],
        mech: [['Loop-closure derivation', R`<p>Closing the vector loop $O\to A\to B$ gives $r\sin\theta=l\sin\varphi$ and $x=r\cos\theta+l\cos\varphi$. Eliminating $\varphi$ gives $$x(\theta)=r\cos\theta+\sqrt{l^{2}-r^{2}\sin^{2}\theta}.$$</p>`],
          ['Two-force member', R`<p>Neglecting rod inertia, the rod is loaded only at two pins, so the force acts along the line $AB$: $F_c=F/\cos\varphi$. It is in compression while the piston is pushed and in tension while it is pulled.</p>`],
          ['Effect of the rod ratio', R`<p>A shorter rod (larger $\lambda$) gives a larger second harmonic $\lambda\cos2\theta$ in the acceleration, more side thrust and a peak acceleration at TDC of $r\omega^2(1+\lambda)$.</p>`]],
        math: [[R`\sin\varphi=\lambda\sin\theta`, 'Rod angle.'], [R`\dfrac{d\varphi}{dt}=\dfrac{\lambda\,\omega\cos\theta}{\cos\varphi}`, 'Angular velocity of the rod.'], [R`F_c=\dfrac{F}{\cos\varphi}`, 'Axial rod force.']],
        fail: ['Buckling: from compressive $F_c$ above the Euler load, causing a bent rod.', 'Small-end fatigue: from alternating tension at TDC, causing cracks at the eye.'],
        build: ['Machine both eyes in one set-up to hold the centre distance $l$ and parallel bores.'],
      },
      live: (S, P) => [R`\varphi=${fmt(S.phi / deg, 2)}^\circ,\quad F_c=${fmt(S.F / Math.cos(S.phi))}\ \text{N}`],
    });

    /* piston (crown with two ring grooves, hollow skirt) and gudgeon pin */
    const pistonPose = api.group('pistonPose'), pistonG = api.group();
    pistonG.add(api.mesh(G.lathe([[0, 32], [35, 32], [35, 30], [33, 30], [33, 28], [35, 28], [35, 26], [33, 26], [33, 24], [35, 24], [35, -28], [30, -28], [30, 20], [0, 20]], 'x', 96)));
    const pinG = api.group(); pinG.add(api.mesh(G.tube(4.5, 9, 64, 'z', 64)));
    pistonPose.add(pistonG, pinG); api.add(pistonPose);
    api.part('piston', pistonG, {
      name: 'Piston', tag: 'P-06', material: 'Aluminium alloy EN AW-4032-T6', explode: [0, 70, 0], tone: 1.0, metal: 0.1,
      section: { axis: 'z', at: 0 },
      specs: { 'Diameter': 'Ø70 mm', 'Ring grooves': '2 × 2 mm', 'Skirt wall': '5 mm' },
      dims: [{ view: 'front', a: [20, 35, 0], b: [32, 35, 0], orient: 'h', off: -10 }],
      desc: 'Slider of the mechanism; its position $x$ is the output of the kinematics.',
      info: {
        role: 'Moves along the stroke between top dead centre ($\\theta=0$) and bottom dead centre ($\\theta=\\pi$) and carries the reciprocating mass $m_r$.',
        steps: ['At $\\theta=0$ it is at TDC, $x=l+r$, with zero velocity and maximum deceleration.', 'Its peak speed occurs slightly before $\\theta=90^\\circ$, where $dx/d\\theta$ is extreme.', 'At $\\theta=\\pi$ it reaches BDC, $x=l-r$.'],
        mech: [['Velocity', R`<p>Differentiating $x(\theta)$ with $\dot\theta=\omega$: $$v=-\omega\left(r\sin\theta+\dfrac{r^{2}\sin\theta\cos\theta}{\sqrt{l^{2}-r^{2}\sin^{2}\theta}}\right).$$</p>`],
          ['Acceleration', R`<p>Differentiating again at constant $\omega$, with $L=\sqrt{l^{2}-r^{2}\sin^{2}\theta}$: $$a=-\omega^{2}\left(r\cos\theta+\dfrac{r^{2}\cos2\theta}{L}+\dfrac{r^{4}\sin^{2}\theta\cos^{2}\theta}{L^{3}}\right).$$ For small $\lambda$ this tends to $a\approx-r\omega^{2}(\cos\theta+\lambda\cos2\theta)$.</p>`],
          ['Inertia force', R`<p>The rod must apply $F=m_r a$ to the reciprocating mass. At TDC this is $F=-m_r r\omega^{2}(1+\lambda)$, which pulls the piston back toward the crank.</p>`]],
        math: [[R`x=r\cos\theta+\sqrt{l^{2}-r^{2}\sin^{2}\theta}`, 'Exact position.'], [R`a(0)=-r\omega^{2}(1+\lambda),\qquad a(\pi)=r\omega^{2}(1-\lambda)`, 'Accelerations at the dead centres.']],
        fail: ['Crown cracking: from thermal and pressure cycling.', 'Ring land fracture: from high inertia at overspeed.', 'Skirt scuffing: from side thrust $F_n$ with poor lubrication.'],
        build: ['Turn the skirt with a slight barrel profile; fit the rings after the grooves are finished.'],
      },
      live: (S, P) => [R`x=${fmt(P.r, 0)}\cos ${fmt(S.th / deg, 1)}^\circ+\sqrt{${fmt(P.l, 0)}^{2}-${fmt(P.r, 0)}^{2}\sin^{2}${fmt(S.th / deg, 1)}^\circ}=${fmt(S.x)}\ \text{mm}`, R`v=${fmt(S.v)}\ \text{m/s},\quad a=${fmt(S.a, 1)}\ \text{m/s}^2`],
    });
    api.part('pin', pinG, {
      name: 'Gudgeon pin', tag: 'P-07', material: 'Case-hardened steel 16MnCr5', explode: [0, 0, 75], tone: 1.18, metal: 0.3,
      section: { axis: 'x', at: 0 },
      specs: { 'Outside diameter': 'Ø18 mm', 'Bore': 'Ø9 mm', 'Length': '64 mm' },
      dims: [{ view: 'front', dia: true, c: [0, 0, 32], r: 9, ang: 45 }, { view: 'front', dia: true, c: [0, 0, 32], r: 4.5, ang: 150 }],
      desc: 'Pin joint $B$ between the piston and the rod small end.',
      info: {
        role: 'Forms the revolute joint $B$ that lets the rod swing while the piston translates.',
        steps: ['It carries the full rod force $F_c$ in double shear.', 'Relative rotation is small: $\\pm\\varphi_{\\max}$.'],
        mech: [['Double shear', R`<p>The pin is supported in the two piston bosses and loaded in the middle by the rod, so each shear plane carries $F_c/2$: $$\tau=\dfrac{F_c/2}{\tfrac{\pi}{4}\left(d_o^{2}-d_i^{2}\right)}.$$</p>`]],
        math: [[R`\tau=\dfrac{2F_c}{\pi\left(d_o^{2}-d_i^{2}\right)}`, 'Mean shear stress in the pin.']],
        fail: ['Fretting wear: from oscillating motion, causing looseness.', 'Fatigue: from alternating bending, causing fracture at mid-span.'],
        build: ['Case-harden and grind; the hollow bore reduces the reciprocating mass.'],
      },
      live: (S, P) => { const Fc = Math.abs(S.F / Math.cos(S.phi)), tau = 2 * Fc / (Math.PI * (18 ** 2 - 9 ** 2)); return [R`\tau=\dfrac{2\times${fmt(Fc, 1)}}{\pi\,(18^{2}-9^{2})}=${fmt(tau, 3)}\ \text{MPa}`]; },
    });
    return { crankSpin, rodPose, pistonPose };
  },
  pose(S, P, m) {
    const th = S.th ?? 0, x = K.x(th, P);
    m.crankSpin.rotation.z = th;
    m.rodPose.position.set(P.r * Math.cos(th), P.r * Math.sin(th), 0);
    m.rodPose.rotation.z = Math.atan2(-P.r * Math.sin(th), x - P.r * Math.cos(th));
    m.pistonPose.position.set(x, 0, 0);
  },
  drawing: { section: { axis: 'z', at: 0 } },

  /* ---------------- governing equations (LaTeX only) ---------------- */
  equations: [
    { group: 'Kinematics', assume: 'rigid links, in-line geometry (no offset), frictionless revolute joints, constant crank speed $\\omega$.', items: [
      { tex: R`x(\theta)=r\cos\theta+\sqrt{l^{2}-r^{2}\sin^{2}\theta}`, note: 'Exact piston-pin position measured from the crank axis.' },
      { tex: R`\sin\varphi=\lambda\sin\theta,\qquad \lambda=\dfrac{r}{l}`, note: 'Rod angle from the loop closure $r\\sin\\theta=l\\sin\\varphi$.' },
      { tex: R`\dfrac{dx}{d\theta}=-r\sin\theta-\dfrac{r^{2}\sin\theta\cos\theta}{\sqrt{l^{2}-r^{2}\sin^{2}\theta}}=-\dfrac{r\sin(\theta+\varphi)}{\cos\varphi}` },
      { tex: R`v=\omega\,\dfrac{dx}{d\theta},\qquad \omega=\dfrac{2\pi n}{60}` },
      { tex: R`a=-\omega^{2}\left(r\cos\theta+\dfrac{r^{2}\cos2\theta}{L}+\dfrac{r^{4}\sin^{2}\theta\cos^{2}\theta}{L^{3}}\right),\qquad L=\sqrt{l^{2}-r^{2}\sin^{2}\theta}`, note: 'Exact acceleration at constant $\\omega$.' },
      { tex: R`a\approx-r\omega^{2}\left(\cos\theta+\lambda\cos2\theta\right)`, note: 'Two-term approximation, shown dashed on the acceleration graph for comparison.' },
      { tex: R`x_{\max}-x_{\min}=2r` , note: 'Stroke between top and bottom dead centre.' },
    ] },
    { group: 'Dynamics', assume: 'massless rod (its mass lumped into $m_r$ at the pin), no gas pressure, no friction.', items: [
      { tex: R`F=m_r\,a`, note: 'Force the rod must apply to the reciprocating mass.' },
      { tex: R`T\,\omega=F\,v\ \Rightarrow\ T=F\,\dfrac{dx}{d\theta}=-F\,\dfrac{r\sin(\theta+\varphi)}{\cos\varphi}`, note: 'Crank torque from the principle of virtual work.' },
      { tex: R`F_c=\dfrac{F}{\cos\varphi},\qquad F_n=F\tan\varphi`, note: 'Rod force and guide side thrust.' },
      { tex: R`\oint T\,d\theta=0,\qquad \int_{0}^{\theta}T\,d\theta=\tfrac12\,m_r\left(v^{2}(\theta)-v^{2}(0)\right)`, note: 'Work–energy statements used by the validation checks.' },
    ] },
  ],
  live: (S, P) => [
    R`\theta=${fmt(S.th / deg, 1)}^\circ,\quad \omega=${fmt(K.w(P), 2)}\ \text{rad/s},\quad \lambda=${fmt(P.r / P.l, 3)}`,
    R`x=${fmt(S.x)}\ \text{mm},\quad v=${fmt(S.v)}\ \text{m/s},\quad a=${fmt(S.a, 1)}\ \text{m/s}^{2}`,
    R`F=${fmt(P.m, 2)}\times${fmt(S.a, 1)}=${fmt(S.F, 1)}\ \text{N},\quad T=${fmt(S.T, 2)}\ \text{N\,m}`,
  ],

  /* ---------------- graphs: sampled from the same functions as the simulation ---------------- */
  graphs: [
    { id: 'x', title: 'Position', x: { tex: R`\theta`, unitTex: R`^\circ`, domain: [0, 360], step: 45 }, y: { tex: 'x', unitTex: R`\text{mm}` },
      series: [{ tex: R`x(\theta)`, f: D(K.x) }], cursor: S => S.th / deg, family: { param: 'r', count: 9 }, note: 'Exact position; top dead centre at $0^\\circ$, bottom dead centre at $180^\\circ$. Sweep varies the crank radius $r$.' },
    { id: 'v', title: 'Velocity', x: { tex: R`\theta`, unitTex: R`^\circ`, domain: [0, 360], step: 45 }, y: { tex: 'v', unitTex: R`\text{m/s}`, includeZero: true },
      series: [{ tex: R`v(\theta)`, f: D(K.v) }], cursor: S => S.th / deg, family: { param: 'n', from: 600, to: 6000, count: 10 } },
    { id: 'a', title: 'Acceleration', x: { tex: R`\theta`, unitTex: R`^\circ`, domain: [0, 360], step: 45 }, y: { tex: 'a', unitTex: R`\text{m/s}^2`, includeZero: true },
      series: [{ tex: R`a\ \text{exact}`, f: D(K.a) }, { tex: R`-r\omega^{2}(\cos\theta+\lambda\cos2\theta)`, f: D(K.aApprox), dash: true }], cursor: S => S.th / deg, readDigits: 1,
      family: { param: 'l', count: 9 }, note: 'Sweep varies the rod length $l$: a shorter rod (larger $\\lambda$) strengthens the $\\cos 2\\theta$ harmonic.' },
    { id: 'phi', title: 'Rod angle', x: { tex: R`\theta`, unitTex: R`^\circ`, domain: [0, 360], step: 45 }, y: { tex: R`\varphi`, unitTex: R`^\circ`, includeZero: true },
      series: [{ tex: R`\varphi(\theta)`, f: D(K.phi, 1 / deg) }], cursor: S => S.th / deg },
    { id: 'T', title: 'Crank torque', x: { tex: R`\theta`, unitTex: R`^\circ`, domain: [0, 360], step: 45 }, y: { tex: 'T', unitTex: R`\text{N\,m}`, includeZero: true },
      series: [{ tex: R`T(\theta)`, f: D(K.T) }], cursor: S => S.th / deg, family: { param: 'm', count: 9 }, note: 'Torque needed to accelerate the reciprocating mass; its mean over a revolution is zero. Sweep varies $m_r$.' },
  ],

  /* ---------------- validation: independent numerical checks of the implemented physics ---------------- */
  checks: [
    { title: 'Velocity equals the numerical derivative of position', tex: R`\max_\theta\left|v-\omega\,\tfrac{\Delta x}{\Delta\theta}\right|`,
      run: P => ({ value: WP.num.maxAbs(th => K.v(th, P) - K.w(P) * WP.num.d1(t => K.x(t, P), th) / 1000, 0, 2 * Math.PI), limit: 1e-6, unitTex: R`\text{m/s}` }) },
    { title: 'Acceleration equals the numerical derivative of velocity', tex: R`\max_\theta\left|a-\omega\,\tfrac{\Delta v}{\Delta\theta}\right|`,
      run: P => ({ value: WP.num.maxAbs(th => K.a(th, P) - K.w(P) * WP.num.d1(t => K.v(t, P), th), 0, 2 * Math.PI), limit: 1e-3, unitTex: R`\text{m/s}^2` }) },
    { title: 'Stroke equals twice the crank radius', tex: R`\left|x(0)-x(\pi)-2r\right|`,
      run: P => ({ value: Math.abs(K.x(0, P) - K.x(Math.PI, P) - 2 * P.r), limit: 1e-9, unitTex: R`\text{mm}` }) },
    { title: 'Largest rod angle equals arcsin of the rod ratio', tex: R`\left|\max_\theta\varphi-\arcsin\lambda\right|`,
      run: P => { let m = 0; for (let i = 0; i <= 20000; i++) m = Math.max(m, K.phi(i / 20000 * 2 * Math.PI, P)); return { value: Math.abs(m - Math.asin(P.r / P.l)), limit: 1e-6, unitTex: R`\text{rad}` }; } },
    { title: 'Virtual-work torque equals the rod-force torque', tex: R`\max_\theta\left|F\tfrac{dx}{d\theta}+F\tfrac{r\sin(\theta+\varphi)}{\cos\varphi}\right|`,
      run: P => ({ value: WP.num.maxAbs(th => K.T(th, P) - K.Tgeo(th, P), 0, 2 * Math.PI), limit: 1e-9, unitTex: R`\text{N\,m}` }) },
    { title: 'Inertia torque does no net work per revolution', tex: R`\left|\oint T\,d\theta\right|`,
      run: P => ({ value: Math.abs(WP.num.simpson(th => K.T(th, P), 0, 2 * Math.PI, 4000)), limit: 1e-6, unitTex: R`\text{J}` }) },
    { title: 'Work done by the torque equals the change of kinetic energy', tex: R`\left|\int_0^{\pi/2}T\,d\theta-\tfrac12 m_r v^{2}(\tfrac{\pi}{2})\right|`,
      run: P => ({ value: Math.abs(WP.num.simpson(th => K.T(th, P), 0, Math.PI / 2, 4000) - 0.5 * P.m * K.v(Math.PI / 2, P) ** 2), limit: 1e-6, unitTex: R`\text{J}` }) },
    { title: 'Long-rod limit reduces to simple harmonic motion', tex: R`\lambda\to0:\ \max_\theta\dfrac{\left|a+r\omega^{2}\cos\theta\right|}{r\omega^{2}}`,
      run: P => { const Q = { ...P, l: P.r * 1e5 }, a0 = P.r / 1000 * K.w(P) ** 2; return { value: WP.num.maxAbs(th => (K.a(th, Q) + a0 * Math.cos(th)) / a0, 0, 2 * Math.PI), limit: 1e-4 }; } },
  ],
});
function fmt(v, d = 2) { return WP.fmt(v, d); }
</script>
