<style>
/* webpmesim.css — Website Physics Math Engineering Simulator. Original work; no attribution required. */

/* ================= themes ================= */
:root, html[data-theme="blueprint"] {
  --bg: #0a223f; --bg-grid-major: rgba(56,189,248,.20); --bg-grid-minor: rgba(56,189,248,.07);
  --panel: rgba(8,26,48,.94); --panel-2: rgba(14,40,70,.96); --field: rgba(4,18,34,.9);
  --border: rgba(125,211,252,.28); --border-hi: #38bdf8;
  --text: #e0f2fe; --text-dim: #93b8d6; --accent: #7dd3fc; --accent-ink: #04233f;
  --data: #fde68a; --geo: #38bdf8; --ok: #4ade80; --alert: #f87171;
  --c1: #38bdf8; --c2: #fbbf24; --c3: #4ade80; --c4: #f472b6; --c5: #a78bfa; --c6: #fb923c;
  --plot-bg: rgba(4,18,34,.75); --plot-grid: rgba(125,211,252,.16); --plot-axis: rgba(224,242,254,.65);
  --scene-bg: #0a223f; --scene-grid-1: #38bdf8; --scene-grid-2: #16406b; --scene-shadow: .35;
  --part: #e2e8f0; --part-metal: .55; --part-rough: .38; --part-edge: #0b2a4a; --part-edge-op: .55;
  --select: #00e5ff;
  --scene-grid-op: .5; --wire-mesh-op: 0; --plot-glow: 0;
  --wire-1: #4dff6a; --wire-2: #ff7a1f; --wire-3: #2ae8ff; --wire-4: #ffb347;
  --f-stamp: var(--f-head);
  --caution: #fbbf24; --title: var(--accent);
  --plot-style: line; --plot-major: var(--plot-grid); --fam-1: #38bdf8; --fam-2: #a78bfa; --fam-3: #f472b6;
  --seg-off: rgba(125,211,252,.12); --seg-on: var(--ok); --z1: #4ade80; --z2: #fbbf24; --z3: #f87171;
  --f-ui: "Roboto", "Segoe UI", Arial, sans-serif; --f-mono: "Roboto Mono", Consolas, monospace; --f-head: "Roboto", Arial, sans-serif;
  --head-weight: 700; --head-track: .06em; --head-squeeze: 1; --radius: 3px;
}
html[data-theme="white"] {
  --bg: #f3f5f8; --bg-grid-major: rgba(30,58,95,.08); --bg-grid-minor: rgba(30,58,95,.03);
  --panel: rgba(255,255,255,.97); --panel-2: #f6f8fa; --field: #ffffff;
  --border: #cfd6de; --border-hi: #1f4e79;
  --text: #111827; --text-dim: #4b5563; --accent: #1f4e79; --accent-ink: #ffffff;
  --data: #0f5f59; --geo: #1d4ed8; --ok: #15803d; --alert: #b91c1c;
  --c1: #1d4ed8; --c2: #c2410c; --c3: #15803d; --c4: #be185d; --c5: #6d28d9; --c6: #a16207;
  --plot-bg: #ffffff; --plot-grid: rgba(17,24,39,.10); --plot-axis: rgba(17,24,39,.70);
  --scene-bg: #eef1f4; --scene-grid-1: #94a3b8; --scene-grid-2: #d5dbe2; --scene-shadow: .18;
  --part: #b9c0c8; --part-metal: .6; --part-rough: .35; --part-edge: #1f2937; --part-edge-op: .5;
  --select: #0369a1;
  --caution: #b45309; --fam-1: #1d4ed8; --fam-2: #7c3aed; --fam-3: #be185d;
  --seg-off: rgba(17,24,39,.08); --seg-on: #15803d; --z1: #15803d; --z2: #b45309; --z3: #b91c1c;
  --f-ui: "Roboto", "Segoe UI", Arial, sans-serif; --f-mono: "Roboto Mono", Consolas, monospace; --f-head: "Roboto", Arial, sans-serif;
  --head-weight: 700; --head-track: .04em; --head-squeeze: 1; --radius: 3px;
}
/* CRT — immersive phosphor operations console (original design).
   Colour jobs: orange = structure and primary traces, yellow = titles, green = live values and scope graticule,
   teal = geometry axes, red = alarms only. Parts render as neon wireframes with bloom over green polar rings. */
html[data-theme="crt"] {
  --bg: #000; --bg-grid-major: transparent; --bg-grid-minor: transparent;
  --panel: rgba(3,2,2,.93); --panel-2: #0a0605; --field: #040202;
  --border: rgba(255,92,54,.42); --border-hi: #ff6a3a; --rule: rgba(255,140,60,.14);
  --text: #f0dcc4; --text-dim: #a8876c; --accent: #ff8c1a; --accent-dim: #b65a14; --accent-ink: #000; --title: #ffd24a;
  --data: #3dff7a; --geo: #3fe6c8; --ok: #3dff7a; --alert: #ff2b2b; --caution: #ffc21a;
  --c1: #ff8c1a; --c2: #3dff7a; --c3: #3fe6c8; --c4: #ffd24a; --c5: #e24dff; --c6: #ff4d2e;
  --plot-bg: #000; --plot-style: scope; --plot-grid: rgba(61,255,122,.75); --plot-major: rgba(61,255,122,.42); --plot-axis: #ff8c1a; --plot-glow: 9;
  --fam-1: #ff3b2b; --fam-2: #e24dff; --fam-3: #3f7bff;
  --scene-bg: #010103; --scene-grid-1: #ffb347; --scene-grid-2: #a8560f; --scene-grid-op: .5; --scene-shadow: 0;
  --wire-1: #ff7a1a; --wire-2: #ffb000; --wire-3: #ff4d2e; --wire-4: #ffd35a; --wire-mesh-op: .3;
  --crt-ring: #2bff6a; --crt-axis: #3fe6c8;
  --part: #1b1f22; --part-metal: .1; --part-rough: .95; --part-edge: #ff7a1a; --part-edge-op: 1;
  --select: #3dff7a;
  --seg-off: rgba(61,255,122,.10); --seg-on: #3dff7a; --z1: #3dff7a; --z2: #ffc21a; --z3: #ff2b2b;
  --f-ui: "Share Tech Mono", "Roboto Mono", Consolas, monospace; --f-mono: "Share Tech Mono", "Roboto Mono", Consolas, monospace;
  --f-head: "Noto Serif Display", Georgia, serif; --f-stamp: "Saira Extra Condensed", "Arial Narrow", sans-serif;
  --head-weight: 800; --head-track: .18em; --head-squeeze: .8; --radius: 0;
}

/* ================= fluid type: everything is rem-based ================= */
html { font-size: clamp(13px, calc(.38vw + 9.6px), 20px); -webkit-text-size-adjust: 100%; }
@media (max-width: 820px) { html { font-size: clamp(14px, calc(1.2vw + 8.5px), 16px); } }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font: 400 1rem/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
body { background-image:
  linear-gradient(var(--bg-grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid-major) 1px, transparent 1px),
  linear-gradient(var(--bg-grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid-minor) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--border-hi); outline-offset: 1px; }
.katex { font-size: 1.08em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: .2rem 0; margin: .4rem 0; }

/* ================= CRT layer and console chrome: only in CRT theme ================= */
.wp-crt-scan, .wp-crt-sweep { display: none; }
html[data-theme="crt"] .wp-crt-scan { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 9000;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.5) 2px 3px); opacity: .14;
  box-shadow: inset 0 0 140px 20px rgba(0,0,0,.65); }                                   /* scanlines + edge vignette */
html[data-theme="crt"] .wp-crt-sweep { display: block; position: fixed; left: 0; right: 0; top: -12vh; height: 12vh; z-index: 9001; pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(77,255,106,.018), transparent); animation: wp-sweep 8s linear infinite; }
@keyframes wp-sweep { to { transform: translateY(124vh); } }
@keyframes wp-flicker { 0%, 100% { opacity: 1; } 47% { opacity: .985; } 48% { opacity: 1; } 83% { opacity: .978; } 84% { opacity: 1; } }
@keyframes wp-blink { 50% { opacity: .2; } }
html[data-theme="crt"] body { background: radial-gradient(ellipse 120% 70% at 50% 115%, rgba(30,60,220,.22), transparent 70%), #000; }
html[data-theme="crt"] .wp-header, html[data-theme="crt"] .wp-rail, html[data-theme="crt"] .wp-win { animation: wp-flicker 6s steps(1) infinite; }

/* top bar: compressed serif mark, facility line, lamp, toolbar groups, ticker */
html[data-theme="crt"] .wp-header { background: #000; border-bottom: 1px solid var(--accent-dim); }
html[data-theme="crt"] .wp-bar { border-bottom: 1px solid var(--rule); }
html[data-theme="crt"] .wp-title-text { font-size: 1.55rem; color: var(--accent); text-shadow: 0 0 4px rgba(255,140,26,.6), 0 0 18px rgba(255,140,26,.25); }
html[data-theme="crt"] .wp-subtitle { text-transform: uppercase; letter-spacing: .16em; font-size: .6rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-facility { color: var(--accent); border-left-color: var(--rule); text-shadow: 0 0 6px rgba(255,140,26,.35); }
html[data-theme="crt"] .wp-status { border-left-color: var(--rule); text-shadow: 0 0 6px currentColor; }
html[data-theme="crt"] .wp-hud span { text-transform: uppercase; font-size: .6rem; letter-spacing: .14em; color: var(--accent-dim); }
html[data-theme="crt"] .wp-hud b { font-size: .82rem; text-shadow: 0 0 5px rgba(61,255,122,.55); }
html[data-theme="crt"] .wp-qbtn { color: var(--text-dim); letter-spacing: .16em; }
html[data-theme="crt"] .wp-qbtn:hover, html[data-theme="crt"] .wp-qbtn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent-dim); }
html[data-theme="crt"] .wp-toolbar { background: linear-gradient(#050302, #000); }
html[data-theme="crt"] .wp-tlabel { color: var(--accent); text-shadow: 0 0 5px rgba(255,140,26,.5); }
html[data-theme="crt"] .wp-tbtn { background: #0a0807; border-color: #2a201a; color: #b8a48e; }
html[data-theme="crt"] .wp-tbtn:hover { border-color: var(--accent-dim); color: var(--accent); }
html[data-theme="crt"] .wp-tbtn[aria-pressed="true"] { color: var(--title); border-color: var(--accent); background: rgba(255,140,26,.14); box-shadow: inset 0 0 8px rgba(255,140,26,.35); }
html[data-theme="crt"] .wp-ticker { color: var(--accent); text-shadow: 0 0 6px rgba(255,140,26,.45); }
/* left rail: numbered channels, amber active block */
html[data-theme="crt"] .wp-rail { background: #000; border-right: 1px solid var(--border); counter-reset: wp-ch; }
html[data-theme="crt"] .wp-rail .wp-group { color: var(--accent-dim); letter-spacing: .22em; border-bottom: 1px solid var(--rule); margin: 0 .3rem .2rem; padding-left: .25rem; }
html[data-theme="crt"] .wp-rail button.wp-nav { text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-rail button.wp-nav[data-win]::after { counter-increment: wp-ch; content: counter(wp-ch, decimal-leading-zero); margin-left: auto; font-size: .64rem; color: #4a4a44; }
html[data-theme="crt"] .wp-rail button.wp-nav:hover { color: var(--accent); background: none; border-color: var(--border); }
html[data-theme="crt"] .wp-rail button.wp-nav[aria-expanded="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
html[data-theme="crt"] .wp-rail button.wp-nav[aria-expanded="true"]::after { color: #000; }
html.wp-rail-mini[data-theme="crt"] .wp-rail button.wp-nav::after { display: none; }
@media (max-width: 820px) { html[data-theme="crt"] .wp-rail button.wp-nav::after { display: none; } }
html[data-theme="crt"] .wp-seg { border-color: var(--border); }
html[data-theme="crt"] .wp-seg button { text-transform: uppercase; letter-spacing: .1em; }

/* windows: registration corner ticks, status lamp, compressed serif title */
html[data-theme="crt"] .wp-win { background: rgba(3,3,4,.95); border-color: var(--border); }
html[data-theme="crt"] .wp-win::before, html[data-theme="crt"] .wp-win::after { content: ""; position: absolute; z-index: 2; width: .6rem; height: .6rem; border: 0 solid var(--accent); pointer-events: none; }
html[data-theme="crt"] .wp-win::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
html[data-theme="crt"] .wp-win::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
html[data-theme="crt"] .wp-win.is-top { border-color: rgba(255,154,46,.6); }
html[data-theme="crt"] .wp-win-head { background: #000; border-bottom: 1px solid var(--border); padding-left: .7rem; }
html[data-theme="crt"] .wp-win-head::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); flex: none; }
html[data-theme="crt"] .wp-win.is-top .wp-win-head::before { animation: wp-blink 1.2s steps(1) infinite; }
html[data-theme="crt"] .wp-win-title { font-size: .95rem; text-shadow: 0 0 4px rgba(255,154,46,.45); }
html[data-theme="crt"] .wp-win-head .wp-x { border-color: var(--border); }
html[data-theme="crt"] .wp-win-body { scrollbar-color: var(--accent-dim) #000; }

/* content: tiny amber labels, green data, sharp blocks */
html[data-theme="crt"] .wp-h { color: var(--accent); letter-spacing: .2em; font-size: .7rem; border-bottom: 1px solid var(--rule); padding-bottom: .25rem; }
html[data-theme="crt"] .wp-btn { text-transform: uppercase; letter-spacing: .1em; font-size: .74rem; background: #000; border-color: var(--border); }
html[data-theme="crt"] .wp-btn:hover { color: var(--accent); border-color: var(--accent); }
html[data-theme="crt"] .wp-btn.is-primary { background: var(--accent); color: #000; }
html[data-theme="crt"] .wp-card { background: #000; border-color: var(--rule); border-left: 2px solid var(--accent-dim); }
html[data-theme="crt"] .wp-card.is-live { border-color: rgba(77,255,106,.35); border-left-color: var(--ok); }
html[data-theme="crt"] .wp-card .katex-display, html[data-theme="crt"] .wp-tabpanel .katex-display { color: #e9ffe9; text-shadow: 0 0 6px rgba(77,255,106,.25); }
html[data-theme="crt"] .wp-card.is-live .katex { color: var(--data); text-shadow: 0 0 5px rgba(77,255,106,.35); }
html[data-theme="crt"] .wp-field output, html[data-theme="crt"] .wp-kv dd, html[data-theme="crt"] .wp-spec b, html[data-theme="crt"] .wp-table td.num { text-shadow: 0 0 4px rgba(77,255,106,.4); }
html[data-theme="crt"] .wp-field > span { text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; color: var(--text-dim); }
html[data-theme="crt"] .wp-tabs { border-bottom-color: var(--border); gap: 0; }
html[data-theme="crt"] .wp-tabs button { text-transform: uppercase; letter-spacing: .12em; font-size: .7rem; border: 1px solid transparent; border-bottom: 0; }
html[data-theme="crt"] .wp-tabs button[aria-selected="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
html[data-theme="crt"] .wp-table th { color: var(--accent); border-bottom-color: var(--accent-dim); }
html[data-theme="crt"] .wp-table td { border-bottom-color: var(--rule); }
html[data-theme="crt"] .wp-pass, html[data-theme="crt"] .wp-fail { font-family: var(--f-stamp); font-size: .95rem; letter-spacing: .16em; }
html[data-theme="crt"] .wp-pass { color: var(--ok); text-shadow: 0 0 6px rgba(77,255,106,.5); }
html[data-theme="crt"] .wp-fail { color: var(--alert); text-shadow: 0 0 6px rgba(255,59,48,.6); animation: wp-blink 1s steps(1) infinite; }
html[data-theme="crt"] .wp-spec div { background: #000; border-color: var(--rule); }
html[data-theme="crt"] .wp-spec span, html[data-theme="crt"] .wp-kv dt { color: var(--accent-dim); }
html[data-theme="crt"] .wp-tree li.is-sel { outline-color: var(--accent); background: rgba(255,154,46,.08); }
html[data-theme="crt"] .wp-tree .wp-dot { background: var(--dot); box-shadow: 0 0 6px var(--dot); }
html[data-theme="crt"] .wp-legend, html[data-theme="crt"] .wp-readout { text-transform: none; }
html[data-theme="crt"] .wp-hint, html[data-theme="crt"] .wp-badge { background: #000; text-transform: uppercase; letter-spacing: .1em; font-size: .64rem; border-color: var(--rule); color: var(--accent-dim); }
html[data-theme="crt"] .wp-badge { color: var(--accent); }

/* notice: amber hazard band, stamp label, compressed serif title */
html[data-theme="crt"] .wp-modal { background: rgba(0,0,0,.78); }
html[data-theme="crt"] .wp-modal-card { background: #000; border: 1px solid var(--accent); position: relative; padding-top: 2rem; box-shadow: 0 0 0 1px #000, 0 0 40px rgba(255,154,46,.12); }
html[data-theme="crt"] .wp-modal-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .6rem;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 .7rem, #000 .7rem 1.4rem); }
html[data-theme="crt"] .wp-modal-card .wp-eyebrow { display: inline-block; font-family: var(--f-stamp); font-size: .85rem; letter-spacing: .24em; color: var(--accent); border: 2px solid var(--accent); padding: .1rem .5rem 0; margin-bottom: .6rem; }
html[data-theme="crt"] .wp-modal-card h2 { font-size: 1.9rem; display: inline-block; transform: scaleX(var(--head-squeeze)); transform-origin: left center; white-space: nowrap; text-shadow: 0 0 6px rgba(255,154,46,.5); }
html[data-theme="crt"] .wp-modal-card p, html[data-theme="crt"] .wp-modal-card li { color: var(--text); }
html[data-theme="crt"] .wp-preview-bar { background: #000; border-bottom-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  html[data-theme="crt"] .wp-header, html[data-theme="crt"] .wp-rail, html[data-theme="crt"] .wp-win,
  html[data-theme="crt"] .wp-win-head::before, html[data-theme="crt"] .wp-fail { animation: none !important; }
}

/* ================= header ================= */
:root { --top-h: 5.3rem; }
.wp-header { position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); z-index: 50; display: flex; flex-direction: column;
  background: var(--panel); border-bottom: 1px solid var(--border); }
.wp-bar { flex: 1; display: flex; align-items: center; gap: 1.1rem; padding: 0 1rem; min-height: 0; border-bottom: 1px solid var(--border); }
.wp-brand { display: flex; flex-direction: column; justify-content: center; gap: .2rem; min-width: 0; flex: none; }
.wp-title-text { font: var(--head-weight) 1.15rem/1 var(--f-head); letter-spacing: var(--head-track); text-transform: uppercase; color: var(--accent);
  display: inline-block; transform: scaleX(var(--head-squeeze)); transform-origin: left center; white-space: nowrap; }
.wp-subtitle { font-size: .68rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 20rem; }
html[data-theme="crt"] .wp-ticker { text-transform: uppercase; }
.katex, .katex * { text-transform: none !important; letter-spacing: normal; }
.wp-facility { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; border-left: 1px solid var(--border); padding-left: 1.1rem; }
.wp-tele-primary { background: none !important; gap: 0 !important; border-width: 1px 0 0 1px !important; }
.wp-tcell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.wp-status { display: inline-flex; align-items: center; gap: .45rem; font: 700 .7rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ok); white-space: nowrap; border-left: 1px solid var(--border); padding-left: 1.1rem; }
.wp-status .wp-lamp, .wp-lampbox .wp-lamp { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; flex: none; display: inline-block; }
.wp-status[data-level="caution"] { color: var(--caution, #d97706); }
.wp-status[data-level="alert"] { color: var(--alert); } .wp-status[data-level="alert"] .wp-lamp { animation: wp-blink .8s steps(1) infinite; }
.wp-hud { margin-left: auto; display: flex; gap: 1.1rem; font: 500 .78rem/1 var(--f-mono); white-space: nowrap; overflow: hidden; }
.wp-hud span { color: var(--text-dim); } .wp-hud b { color: var(--data); font-weight: 500; font-variant-numeric: tabular-nums; }
.wp-quick { display: flex; gap: .3rem; flex: none; }
.wp-qbtn { border: 1px solid transparent; background: none; padding: .45rem .7rem; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--text-dim); border-radius: var(--radius); }
.wp-qbtn:hover, .wp-qbtn[aria-expanded="true"] { color: var(--accent); border-color: var(--border); }

.wp-tgroup { display: flex; align-items: center; gap: .2rem; flex: none; }

/* ================= left rail ================= */

.wp-rail-toggle { position: fixed; left: .4rem; bottom: .4rem; display: none; }

html.wp-rail-mini .wp-rail .wp-label, html.wp-rail-mini .wp-rail .wp-group, html.wp-rail-mini .wp-theme .wp-seg-label { display: none; }

.wp-collapse { margin-top: .3rem; }

/* ================= viewport ================= */

  border: 1px solid var(--border); border-radius: var(--radius); max-width: calc(100% - 1.6rem); }

/* ================= floating windows ================= */

  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 28px rgba(0,0,0,.28); }

.wp-win[hidden] { display: none; }
.wp-win.is-top { border-color: var(--border-hi); }
.wp-win-head { flex: none; display: flex; align-items: center; gap: .5rem; padding: .45rem .5rem .45rem .8rem; border-bottom: 1px solid var(--border);
  cursor: grab; user-select: none; touch-action: none; background: var(--panel-2); }
.wp-win.is-dragging .wp-win-head { cursor: grabbing; }
.wp-win-title { font: var(--head-weight) .8rem/1.1 var(--f-head); letter-spacing: var(--head-track); text-transform: uppercase; color: var(--accent);

.wp-win-body.is-flush { padding: 0; display: flex; flex-direction: column; }

/* ================= common controls ================= */

.wp-tree { list-style: none; margin: 0; padding: 0; }
.wp-tree li { display: flex; align-items: center; gap: .5rem; padding: .3rem .35rem; border-radius: var(--radius); }

/* ================= plots ================= */

/* ================= modal ================= */

/* ================= report panel ================= */

/* ================= small screens ================= */

  .wp-seg { grid-template-columns: 1fr; }

  .wp-win { left: 3.8rem !important; width: calc(100vw - 4.2rem) !important; }

}

/* ================= analysis console components (all themes) ================= */

.wp-seg-meter { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: .8rem; }
.wp-seg-meter i { background: var(--seg-off); }

.wp-seg-meter.is-zoned i.z2:not(.on) { background: color-mix(in srgb, var(--z2) 14%, transparent); } .wp-seg-meter.is-zoned i.z3:not(.on) { background: color-mix(in srgb, var(--z3) 14%, transparent); }
.wp-zone-key { display: flex; gap: 1rem; justify-content: flex-end; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; margin-top: .35rem; }
.wp-zone-key .z1 { color: var(--z1); } .wp-zone-key .z2 { color: var(--z2); } .wp-zone-key .z3 { color: var(--z3); }

.wp-tele-ch { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .5rem; }
.wp-chan { border: 1px solid var(--border); padding: .5rem .6rem; display: flex; flex-direction: column; gap: .4rem; background: var(--panel-2); }
.wp-chan-h { display: flex; justify-content: space-between; align-items: center; font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }

.wp-tagchip { font: 700 .62rem/1 var(--f-mono); letter-spacing: .1em; padding: .2rem .4rem; text-transform: uppercase; color: #000; background: var(--c1); }
.wp-tagchip[data-k="a"] { background: var(--z1); } .wp-tagchip[data-k="b"] { background: var(--geo); } .wp-tagchip[data-k="c"] { background: var(--text-dim); }
.wp-tagchip[data-k="d"] { background: var(--caution); } .wp-tagchip[data-k="e"] { background: var(--c5); } .wp-tagchip[data-k="x"] { background: var(--alert); color: #fff; }
.wp-margins { display: grid; gap: .45rem; }
.wp-margin { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr auto; gap: .7rem; align-items: center; font-size: .8rem; }

.wp-verdict span { font-size: .74rem; color: var(--text-dim); }
.wp-verdict.is-split { border-color: var(--z3); } .wp-verdict.is-split b { color: var(--z3); }
/* event log */
.wp-feed-n { margin-left: auto; font: 500 .7rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); }

/* operating modes */

:root {

  --vault-ease: cubic-bezier(0.25, 0.8, 0.25, 1);

/* The Vault Card styling for floating windows */
.wp-win {
  border-radius: 14px !important;
  background: color-mix(in srgb, var(--panel) 90%, transparent) !important;
  backdrop-filter: blur(24px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
  box-shadow: 0 28px 65px -12px rgba(0, 0, 0, 0.55),
              0 0 0 1px rgba(255, 255, 255, 0.12),
              inset 0 1px 0 0 rgba(255, 255, 255, 0.18) !important;
  will-change: transform, opacity, filter;
  transition: border-color 0.2s ease, box-shadow 0.25s var(--vault-smooth) !important;
}

html[data-theme="crt"] .wp-win {
  background: rgba(10, 10, 10, 0.94) !important;
  backdrop-filter: blur(18px) !important;
  border-color: var(--accent) !important;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85),
              0 0 22px rgba(255, 154, 46, 0.25),
              inset 0 1px 0 rgba(255, 154, 46, 0.4) !important;
}

/* Jitter elastic spring pop-in & blur wipe on window open */
.wp-win:not([hidden]) {
  animation: vault-card-enter 0.38s var(--vault-spring) forwards !important;
}

@keyframes vault-card-enter {
  0% {
    opacity: 0;
    transform: scale(0.84) translateY(28px);
    filter: blur(8px);
  }
  68% {
    opacity: 1;
    transform: scale(1.025) translateY(-3px);
    filter: blur(0px);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
    filter: blur(0px);
  }
}

/* Window header: clean fintech style with subtle bottom border glow */
.wp-win-head {
  border-top-left-radius: 13px !important;
  border-top-right-radius: 13px !important;
  background: transparent !important;
  padding: 0.65rem 0.85rem 0.65rem 1.1rem !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
  transition: background 0.2s ease, border-color 0.2s ease !important;
}

/* Staggered content cascade: contents slide up and fade sequentially */
.wp-win:not([hidden]) .wp-win-head {
  animation: vault-item-enter 0.32s var(--vault-smooth) 0.05s both;
}
.wp-win:not([hidden]) .wp-win-body > * {
  animation: vault-item-enter 0.38s var(--vault-smooth) both;
}
.wp-win:not([hidden]) .wp-win-body > *:nth-child(1) { animation-delay: 0.08s; }
.wp-win:not([hidden]) .wp-win-body > *:nth-child(2) { animation-delay: 0.12s; }
.wp-win:not([hidden]) .wp-win-body > *:nth-child(3) { animation-delay: 0.16s; }
.wp-win:not([hidden]) .wp-win-body > *:nth-child(4) { animation-delay: 0.20s; }
.wp-win:not([hidden]) .wp-win-body > *:nth-child(5) { animation-delay: 0.24s; }
.wp-win:not([hidden]) .wp-win-body > *:nth-child(6) { animation-delay: 0.28s; }

@keyframes vault-item-enter {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.97);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

.wp-mode.is-active, .wp-mode[aria-pressed="true"] {

.wp-field input[type=range] { cursor: grab; }

    animation: none !important; transition: none !important; transform: none !important;
  }

    const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false, fog: false, clippingPlanes: [] }), wire = [];

  /* ------------------------------------------------------------------ navigation: orbit, pan, zoom, fly, move model, pick */
  function bindNavigation() {

      const hits = ray.intersectObjects(meshes, false).filter(i => !W.cut || T.cutPlane.distanceToPoint(i.point) >= 0);
      return hits[0] || null;

    cv.addEventListener('pointerdown', e => {
      down = { x: e.clientX, y: e.clientY };
      if (e.button !== 0 || !(e.shiftKey || W.moveMode)) return;
      const hit = pick(e); if (!hit) return;

    });

      if (e.target.closest && e.target.closest('input, select, textarea, .wp-win-head')) return;

  function fileName(target) { return `${W.project}_${target}_${W.drawOpt.projection}-angle_${W.drawOpt.sheet}.png`; }

  };

<script>
/* webpmesim-console.js — analysis console features and immersive CRT layer for webpmesim. Original work; no attribution required.
   Load after webpmesim.js and before WP.start(model). Every feature is driven by optional model fields:
     telemetry  → Telemetry window (primary readouts, indicator lamps, channels with segmented meters, load margins)
     consensus  → Consensus window (three independent methods vote on one quantity)
     events     → Event log window (model-detected events + engine events: modes, alerts, exports)
     modes      → Operating mode window (preset parameter sets + derived readouts)
     limits     → stress / load limits driving the independent alert status and alert banner
   The top bar status lamp, quick-launch buttons, ticker and alert banner are independent of the Analysis windows. */
(function () {
  'use strict';
  const WP = window.WP, W = WP._, h = WP.h, css = WP.css, tex = WP.tex, fmt = WP.fmt;
  const KIND = { a: 'Data', b: 'Geometry', c: 'System', d: 'Event', e: 'Mode', x: 'Alarm' };
  const C = WP.console = { level: 'nominal', util: 0, worst: null, manual: false, log: [], filter: '', paused: false, mode: null };
  const num = (v, d = 1) => (isFinite(v) ? (+v).toFixed(d) : '—');
  const clock = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

  /* ---------------------------------------------------------------- nav + windows */
  WP.on('init', M => {
    const an = WP.NAV.find(g => g[0] === 'Analysis')[1], at = an.findIndex(i => i[0] === 'check');
    const add = [];
    if (M.telemetry) add.push(['tele', 'Telemetry', 'tele']);
    if (M.consensus) add.push(['vote', 'Consensus', 'vote']);
    add.push(['feed', 'Event log', 'feed']);
    if (M.modes) add.push(['mode', 'Operating mode', 'mode']);
    an.splice(at < 0 ? an.length : at, 0, ...add);
  });
  WP.on('shell', M => {
    if (M.telemetry) WP.defineWindow('tele', M.telemetry.title || 'Telemetry readouts', { w: '50rem', h: '26rem', onOpen: buildTele });
    if (M.consensus) WP.defineWindow('vote', 'Consensus', { w: '30rem', h: '26rem', onOpen: buildVote });
    WP.defineWindow('feed', 'Event log', { w: '34rem', h: '30rem', flush: true, onOpen: buildFeed });
    if (M.modes) WP.defineWindow('mode', 'Operating mode', { w: '34rem', h: '22rem', onOpen: buildMode });
    // quick launch + operator alert in the top bar
    const quick = document.getElementById('wp-quick');
    (M.quick || ['graph', M.telemetry && 'tele', 'inspect']).filter(Boolean).forEach(id => {
      const nav = WP.NAV.flatMap(g => g[1]).find(i => i[0] === id); if (!nav) return;
      quick.append(h('button', { class: 'wp-qbtn', type: 'button', 'data-win': id, 'aria-expanded': 'false', text: nav[1], onclick: () => WP.toggleWin(id) }));
    });
    quick.append(h('button', { class: 'wp-qbtn wp-alert-btn', type: 'button', id: 'wp-alert-btn', 'aria-pressed': 'false', text: 'Alert', title: 'Operator alert override',
      onclick: () => { C.manual = !C.manual; WP.pressed('alertman', C.manual); document.getElementById('wp-alert-btn').setAttribute('aria-pressed', String(C.manual)); evaluate(true); } }));
    // alert banner (independent of the analysis windows)
    document.body.append(h('div', { class: 'wp-alert', id: 'wp-alert', role: 'alert', hidden: true },
      h('div', { class: 'wp-alert-tape' }, h('span', { id: 'wp-alert-tape' })),
      h('div', { class: 'wp-alert-main', id: 'wp-alert-main' }),
      h('div', { class: 'wp-alert-hazard' })));
    document.body.append(h('div', { class: 'wp-alert-edge', 'aria-hidden': 'true' }));
    // CRT viewport frame (rulers, corner brackets, camera data box, caption)
    document.getElementById('wp-view').append(h('div', { class: 'wp-hudframe', 'aria-hidden': 'true' },
      h('div', { class: 'wp-ruler-x' }), h('div', { class: 'wp-ruler-y' }),
      h('div', { class: 'wp-corner tl' }), h('div', { class: 'wp-corner tr' }), h('div', { class: 'wp-corner bl' }), h('div', { class: 'wp-corner br' }),
      h('div', { class: 'wp-camdata', id: 'wp-camdata' }), h('div', { class: 'wp-vcap', id: 'wp-vcap' })));
    makeGrain();
  });

  /* ---------------------------------------------------------------- limits → level → status / banner */
  function peakOf(L, P) { return L.peak ? L.peak(P) : Math.abs(L.value(W.S, P)); }
  function evaluate(force) {
    const M = W.model, P = W.P; let worst = null, util = 0;
    (M.limits || []).forEach(L => { const u = peakOf(L, P) / L.limit(P); if (u > util) { util = u; worst = L; } });
    const level = C.manual || util >= 1 ? 'alert' : util >= (M.cautionAt ?? 0.85) ? 'caution' : 'nominal';
    C.util = util; C.worst = worst;
    if (level !== C.level || force) {
      if (level !== C.level) push(level === 'alert' ? 'x' : level === 'caution' ? 'd' : 'c', level === 'nominal' ? 'CLEAR' : level.toUpperCase(),
        level === 'nominal' ? 'All load margins within limits' : C.manual ? 'Manual override by operator' : `${worst.label} at ${Math.round(util * 100)} % of limit`, worst ? num(peakOf(worst, P), 1) + ' ' + worst.unit : '');
      C.level = level; document.documentElement.dataset.state = level;
    }

  }
  function status() {
    const P = W.P, st = document.getElementById('wp-status'), tx = document.getElementById('wp-status-text'); if (!st) return;
    st.dataset.level = C.level;
    tx.textContent = C.level === 'alert' ? (C.manual ? 'Alert — operator override' : 'Alert — limit exceeded') : C.level === 'caution' ? `Caution — ${C.worst.label}` : 'Nominal active';
    const ban = document.getElementById('wp-alert'); ban.hidden = C.level !== 'alert';
    if (C.level === 'alert') {
      const reason = C.manual ? 'Manual override by operator' : `${C.worst.label} exceeds limit`;
      const vals = (W.model.limits || []).map(L => `${L.label} ${num(peakOf(L, P), 1)} / ${num(L.limit(P), 1)} ${L.unit}`).join(' // ');
      const advice = C.worst && C.worst.advice ? ' // ' + C.worst.advice : '';
      document.getElementById('wp-alert-tape').textContent = `▲ ALERT // ${reason} // ${vals}${advice} ▲`;
      document.getElementById('wp-alert-main').textContent = `▲ ▲  ALERT — ${reason} — ${W.project}  ▲ ▲`;
    }
  }
  WP.on('ready', () => evaluate(true));
  WP.on('params', () => { evaluate(); if (WP.isOpen('vote')) buildVote(); if (WP.isOpen('mode')) buildMode(); if (WP.isOpen('tele')) buildTele(); });

  /* ---------------------------------------------------------------- telemetry readouts */
  function seg(level, n = 20, zones) {
    const on = Math.round(Math.max(0, Math.min(1, level)) * n);
    return h('div', { class: 'wp-seg-meter' + (zones ? ' is-zoned' : ''), role: 'meter', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': Math.round(level * 100) },
      Array.from({ length: n }, (_, i) => h('i', { class: (i < on ? 'on' : '') + (zones ? (i >= n * 0.85 ? ' z3' : i >= n * 0.6 ? ' z2' : ' z1') : '') })));
  }
  function buildTele() {
    const T = W.model.telemetry, body = WP._wm('tele'); if (!T || !body) return;
    body.innerHTML = '';

    const prim = h('div', { class: 'wp-tele-primary' });
    T.primary.forEach((p, i) => prim.append(h('div', { class: 'wp-tcell' + (p.key ? ' is-key' : '') },
      h('span', { class: 'k', text: p.label }), h('span', { class: 'v', id: 'wp-tp-' + i }), h('span', { class: 'u', html: p.sub || '' }))));
    if (T.lamps) prim.append(h('div', { class: 'wp-tcell' }, h('span', { class: 'k', text: T.lampsLabel || 'Indicators' }),
      h('span', { class: 'v wp-lamps' }, T.lamps.map((l, i) => h('span', { class: 'wp-lampbox' }, h('i', { class: 'wp-lamp', id: 'wp-tl-' + i }), h('b', { text: l.label })))),
      h('span', { class: 'u', html: T.lampsSub || '' })));
    body.append(prim);
    const ch = h('div', { class: 'wp-tele-ch' });
    (T.channels || []).forEach((c, i) => ch.append(h('div', { class: 'wp-chan' },
      h('div', { class: 'wp-chan-h' }, h('span', { text: c.label }), h('span', { class: 'wp-tagchip', id: 'wp-tc-s' + i })),
      h('div', { id: 'wp-tc-m' + i }),
      h('div', { class: 'wp-chan-f' }, h('span', { id: 'wp-tc-a' + i }), h('b', { id: 'wp-tc-b' + i })))));
    body.append(ch);
    if ((W.model.limits || []).length) {
      body.append(h('div', { class: 'wp-h', text: 'Load margins' }));
      const tb = h('div', { class: 'wp-margins' });
      W.model.limits.forEach((L, i) => tb.append(h('div', { class: 'wp-margin' },
        h('span', { class: 'n', html: `${WP.esc(L.label)} $${L.tex}$` }), h('div', { id: 'wp-lm-m' + i }), h('b', { id: 'wp-lm-v' + i }))));
      body.append(tb, h('div', { class: 'wp-zone-key' }, h('span', { class: 'z1', text: 'OK' }), h('span', { class: 'z2', text: 'Caution' }), h('span', { class: 'z3', text: 'Danger' })));
    }

  }
  function updateTele() {
    const T = W.model.telemetry, S = W.S, P = W.P; if (!T || !WP.isOpen('tele')) return;
    const set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
    T.primary.forEach((p, i) => set('wp-tp-' + i, `${num(p.value(S, P), p.digits ?? 1)} ${p.unit || ''}`));
    (T.lamps || []).forEach((l, i) => { const e = document.getElementById('wp-tl-' + i); if (e) e.classList.toggle('is-on', !!l.on(S, P)); });
    (T.channels || []).forEach((c, i) => {
      const m = document.getElementById('wp-tc-m' + i); m.replaceChildren(seg(c.level(S, P), 24));
      set('wp-tc-a' + i, `${num(c.value(S, P), c.digits ?? 1)} ${c.unit || ''}`);
      set('wp-tc-b' + i, c.second ? `${num(c.second.value(S, P), c.second.digits ?? 1)} ${c.second.unit || ''}` : '');
      const st = c.state ? c.state(S, P) : null, chip = document.getElementById('wp-tc-s' + i);

  }

  /* ---------------------------------------------------------------- consensus (three-way cross-check) */
  function buildVote() {
    const body = WP._wm('vote'); if (!body) return;

  /* Render a single plot off-screen with clean print-ready or CRT scope colors */
  function renderPrintPlot(spec, P, isCRT = false) {
    const cv = document.createElement('canvas');
    cv.width = 1400;
    cv.height = 760;
    const g = cv.getContext('2d');

    // Sampling
    const n = spec.samples || 1441;
    const [a, b] = typeof spec.x.domain === 'function' ? spec.x.domain(P) : spec.x.domain;
    const xs = new Float64Array(n);
    const ys = spec.series.map(() => new Float64Array(n));
    for (let i = 0; i < n; i++) {
      const x = a + (b - a) * i / (n - 1);
      xs[i] = x;
      spec.series.forEach((se, k) => { ys[k][i] = se.f(x, P); });
    }

    // Parameter sweep family if defined
    let famCurves = [];
    if (spec.family && WP._.sweep) {
      const f = spec.family;
      let fVals = [];
      if (Array.isArray(f.values)) fVals = f.values;
      else {
        const q = WP._.model.params.find(p => p.id === f.param) || {};
        const fa = f.from ?? q.min, fb = f.to ?? q.max, fc = f.count || 9;
        fVals = Array.from({ length: fc }, (_, i) => fa + (fb - fa) * i / (fc - 1));
      }
      famCurves = fVals.map(v => {
        const Q = { ...P, [f.param]: v };
        if (WP._.model.constrain) WP._.model.constrain(Q);
        const yarr = new Float64Array(n);
        for (let i = 0; i < n; i++) yarr[i] = spec.series[0].f(xs[i], Q);
        return { v, ys: yarr };
      });
    }

    // Extents
    let lo = Infinity, hi = -Infinity;
    [...ys, ...famCurves.map(c => c.ys)].forEach(y => y.forEach(v => {
      if (isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    }));
    if (spec.y.includeZero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; lo -= 1; }
    const pad = (hi - lo) * 0.08;
    const yr = [lo - pad, hi + pad];
    const xr = [a, b];

    // Layout
    const L = 120, Tp = 40, pw = cv.width - L - 50, ph = cv.height - Tp - 75;
    const X = x => L + (x - xr[0]) / (xr[1] - xr[0]) * pw;
    const Y = y => Tp + (1 - (y - yr[0]) / (yr[1] - yr[0])) * ph;

    // Background
    g.fillStyle = isCRT ? '#06080c' : '#ffffff';
    g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = isCRT ? '#090d14' : '#f8fafc';
    g.fillRect(L, Tp, pw, ph);

    // Grid
    const xsStep = spec.x.step || ((xr[1] - xr[0]) / 8);
    const ysStep = (yr[1] - yr[0]) / 6;

    g.strokeStyle = isCRT ? '#143824' : '#e2e8f0';
    g.lineWidth = isCRT ? 1.4 : 1.2;
    for (let x = Math.ceil(xr[0] / xsStep) * xsStep; x <= xr[1] + xsStep * 1e-9; x += xsStep) {
      g.beginPath(); g.moveTo(X(x), Tp); g.lineTo(X(x), Tp + ph); g.stroke();
    }
    for (let y = Math.ceil(yr[0] / ysStep) * ysStep; y <= yr[1] + ysStep * 1e-9; y += ysStep) {
      g.beginPath(); g.moveTo(L, Y(y)); g.lineTo(L + pw, Y(y)); g.stroke();
    }

    // Zero axis if visible
    if (yr[0] < 0 && yr[1] > 0) {
      g.strokeStyle = isCRT ? '#22c55e' : '#94a3b8';
      g.lineWidth = isCRT ? 1.8 : 1.5;
      g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(L + pw, Y(0)); g.stroke();
    }

    // Outer border
    g.strokeStyle = isCRT ? '#ff9a2e' : '#64748b';
    g.lineWidth = isCRT ? 2.2 : 2.0;
    g.strokeRect(L, Tp, pw, ph);

    // Ticks & Labels
    g.font = isCRT ? '20px Share Tech Mono, Courier, monospace' : '20px Roboto, Arial, sans-serif';
    g.fillStyle = isCRT ? '#ff9a2e' : '#475569';
    g.textAlign = 'center';
    g.textBaseline = 'top';
    for (let x = Math.ceil(xr[0] / xsStep) * xsStep; x <= xr[1] + xsStep * 1e-9; x += xsStep) {
      g.fillText(fmtNum(x, 1), X(x), Tp + ph + 8);
    }
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let y = Math.ceil(yr[0] / ysStep) * ysStep; y <= yr[1] + ysStep * 1e-9; y += ysStep) {
      g.fillText(fmtNum(y, 1), L - 10, Y(y));
    }

    // Sweep family curves
    if (famCurves.length) {
      g.lineWidth = 1.8;
      g.globalAlpha = isCRT ? 0.6 : 0.45;
      famCurves.forEach((fc, i) => {
        const t = famCurves.length > 1 ? i / (famCurves.length - 1) : 0;
        g.strokeStyle = isCRT
          ? (t < 0.5 ? `rgb(${Math.round(255 - t * 100)}, ${Math.round(40 + t * 40)}, ${Math.round(40 + t * 400)})` : `rgb(${Math.round(200 - (t - 0.5) * 400)}, ${Math.round(60 + (t - 0.5) * 360)}, 255)`)
          : `rgb(${Math.round(200 - t * 160)}, ${Math.round(50 + t * 50)}, ${Math.round(80 + t * 150)})`;
        g.beginPath();
        let pen = false;
        for (let j = 0; j < n; j += 2) {
          const v = fc.ys[j];
          if (!isFinite(v)) { pen = false; continue; }
          const px = X(xs[j]), py = Y(v);
          pen ? g.lineTo(px, py) : g.moveTo(px, py);
          pen = true;
        }
        g.stroke();
      });
      g.globalAlpha = 1.0;
    }

    // Main series
    const colors = isCRT
      ? ['#00e5ff', '#ffea00', '#ff4500', '#e040fb', '#4dff6a']
      : ['#0284c7', '#dc2626', '#16a34a', '#d97706', '#9333ea'];
    spec.series.forEach((se, k) => {
      g.strokeStyle = colors[k % colors.length];
      g.lineWidth = isCRT ? 3.5 : 3.0;
      if (se.dash) g.setLineDash([8, 6]); else g.setLineDash([]);
      g.beginPath();
      let pen = false;
      for (let j = 0; j < n; j++) {
        const v = ys[k][j];
        if (!isFinite(v)) { pen = false; continue; }
        const px = X(xs[j]), py = Y(v);
        pen ? g.lineTo(px, py) : g.moveTo(px, py);
        pen = true;
      }
      g.stroke();
    });
    g.setLineDash([]);

    return cv.toDataURL('image/png');
  }

  /* Main Report Exporter */
  async function exportReport(options = {}) {
    const W = WP._, M = W.model;

      projection: 'first',

      includeCover: true,
      include3D: true,
      includeDrawing: true,
      includeEquations: true,
      includeVerification: true,
      includeGraphs: true,
    }, options);

    const isCRT = opts.theme === 'crt' || (opts.theme !== 'light' && (document.documentElement.dataset.theme === 'crt' || opts.theme === 'auto'));
    const pal = getReportPalette(isCRT);

    onStatus(isCRT ? 'Initializing CRT Cyber-Terminal compilation engine...' : 'Initializing PDF compilation engine...');
    const { jsPDF, html2canvas } = await ensureDeps();

    const savedP = { ...W.P };

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
        doc.setFontSize(7.5);
        doc.setTextColor(...pal.tableHeadText);
        doc.text('Item', 16, y + 4.2);
        doc.text('Part Name', 28, y + 4.2);
        doc.text('Tag', 75, y + 4.2);
        doc.text('Qty', 92, y + 4.2);
        doc.text('Material Spec', 105, y + 4.2);
        doc.text('Mechanical Function / Role', 140, y + 4.2);
        y += 6;

        (W.order || []).forEach((id, idx) => {
          if (y > 275) return;
          const p = W.parts.get(id);
          const meta = p ? p.meta : {};
          doc.setFillColor(...(idx % 2 === 0 ? pal.tableRowEven : pal.tableRowOdd));
          doc.rect(14, y, 182, 5.8, 'F');
          doc.setDrawColor(...pal.tableBorder);
          doc.rect(14, y, 182, 5.8, 'S');

          doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
          doc.setFontSize(7.5);
          doc.setTextColor(...pal.dimTextCol);
          doc.text(String(idx + 1), 16, y + 4.1);
          doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
          doc.setTextColor(...pal.textCol);
          doc.text(meta.name || id, 28, y + 4.1);
          doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
          doc.setTextColor(...pal.labelCol);
          doc.text(meta.tag || `P-0${idx + 1}`, 75, y + 4.1);
          doc.setTextColor(...pal.textCol);
          doc.text(String(meta.qty || 1), 94, y + 4.1);
          doc.setTextColor(...pal.valueCol);
          doc.text(meta.material || 'Standard Alloy', 105, y + 4.1);

          const role = (meta.info && meta.info.role) ? meta.info.role : (meta.desc || 'Structural link');
          const roleTrunc = role.length > 42 ? role.slice(0, 39) + '...' : role;
          doc.setTextColor(...pal.dimTextCol);
          doc.text(roleTrunc, 140, y + 4.1);
          y += 5.8;
        });

        pageIndex++;
      }

      // =========================================================================
      // PAGE 3: ISO ORTHOGRAPHIC 6-VIEW DRAWING SHEET (LANDSCAPE)
      // =========================================================================
      if (opts.includeDrawing && WP.drawing) {
        onStatus('Generating ISO 6-view orthographic drawing sheet...');
        addThemedPage('landscape');
        pagesToStamp.push({ page: pageIndex, landscape: true });

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(...pal.headingCol);
        doc.text(pal.isCRT ? '2.0 ISO 128 ORTHOGRAPHIC GENERAL ARRANGEMENT DRAWING (FIRST-ANGLE)' : '2. ISO ORTHOGRAPHIC 6-VIEW GENERAL ARRANGEMENT DRAWING (ISO 128 / ISO 5456)', 14, 18);

        // Render drawing using drawing module (blueprint paper in CRT, white in standard)
        const drawingUrl = await WP.drawing.render('assembly', {
          projection: opts.projection || 'first',
          sheet: 'A3',
          paper: pal.drawingPaper,
          dataURL: true,
        });

        doc.setDrawColor(...pal.borderCol);
        doc.setLineWidth(0.4);
        doc.rect(14, 22, 269, 172);
        doc.addImage(drawingUrl, 'PNG', 14.5, 22.5, 268, 171);

        pageIndex++;
      }

      // =========================================================================
      // PAGE 4: MATHEMATICAL FORMULATIONS (LATEX RENDERED VIA KATEX)
      // =========================================================================
      if (opts.includeEquations && M.equations) {
        onStatus('Typesetting governing mathematical equations via KaTeX...');
        addThemedPage('portrait');
        pagesToStamp.push({ page: pageIndex, landscape: false });

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
        doc.setFontSize(12);
        doc.setTextColor(...pal.headingCol);
        doc.text(pal.isCRT ? '3.0 GOVERNING ANALYTICAL FORMULATIONS' : '3. MATHEMATICAL FORMULATIONS & GOVERNING EQUATIONS', 14, 22);

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(...pal.dimTextCol);
        doc.text('Closed-form kinematic loop closures, boundary conditions, and inertial dynamics.', 14, 27);

        // Build clean DOM card for equations to capture via html2canvas
        const card = document.createElement('div');
        card.className = 'wp-report-math-sheet';
        card.style.padding = '24px 30px';
        card.style.boxSizing = 'border-box';
        card.style.background = pal.cardHtmlBg;
        card.style.color = pal.cardHtmlText;
        card.style.fontFamily = pal.isCRT ? 'Share Tech Mono, Roboto Mono, monospace' : 'Roboto, Arial, sans-serif';

        M.equations.forEach((grp, gi) => {
          const gDiv = document.createElement('div');
          gDiv.style.marginBottom = '22px';

          const title = document.createElement('div');
          title.style.fontSize = '15px';
          title.style.fontWeight = '700';
          title.style.color = pal.isCRT ? '#ff9a2e' : '#0f244a';
          title.style.borderBottom = pal.isCRT ? '1.5px solid #ff9a2e' : '1.5px solid #cbd5e1';
          title.style.paddingBottom = '4px';
          title.style.marginBottom = '8px';
          title.textContent = `3.${gi + 1} ${grp.group || 'Governing Relations'}`;
          gDiv.append(title);

          if (grp.assume) {
            const assumeDiv = document.createElement('div');
            assumeDiv.style.fontSize = '12px';
            assumeDiv.style.fontStyle = 'italic';
            assumeDiv.style.color = pal.isCRT ? '#94a3b8' : '#475569';
            assumeDiv.style.marginBottom = '10px';
            assumeDiv.style.padding = '6px 10px';
            assumeDiv.style.background = pal.isCRT ? '#141c26' : '#f1f5f9';
            assumeDiv.style.borderRadius = '4px';
            assumeDiv.innerHTML = `<b>Assumptions & Boundary Conditions:</b> ${grp.assume.replace(/\$([^$]+)\$/g, (_, tex) => renderLatex(tex))}`;
            gDiv.append(assumeDiv);
          }

          (grp.items || []).forEach(it => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.alignItems = 'center';
            row.style.justifyContent = 'space-between';
            row.style.padding = '8px 12px';
            row.style.marginBottom = '8px';
            row.style.background = pal.isCRT ? '#0e141d' : '#ffffff';
            row.style.border = pal.isCRT ? '1px solid #233140' : '1px solid #e2e8f0';
            row.style.borderRadius = '4px';

            const mathCol = document.createElement('div');
            mathCol.style.fontSize = '15px';
            mathCol.style.color = pal.isCRT ? '#ffffff' : '#090d16';
            mathCol.innerHTML = renderLatex(it.tex, true);

            const noteCol = document.createElement('div');
            noteCol.style.fontSize = '12px';
            noteCol.style.color = pal.isCRT ? '#ffb347' : '#64748b';
            noteCol.style.textAlign = 'right';
            noteCol.style.maxWidth = '260px';
            noteCol.innerHTML = (it.note || '').replace(/\$([^$]+)\$/g, (_, tex) => renderLatex(tex));

            row.append(mathCol, noteCol);
            gDiv.append(row);
          });

          card.append(gDiv);
        });

        const mathImg = await cardToImage(html2canvas, card, 2, pal);
        doc.addImage(mathImg, 'PNG', 14, 31, 182, 245);

        pageIndex++;
      }

      // =========================================================================
      // PAGE 5: NUMERICAL VERIFICATION & AUDIT TRAIL (13 CHECKS + LIMITS)
      // =========================================================================
      if (opts.includeVerification) {
        onStatus('Auditing verification checks and load margins...');
        addThemedPage('portrait');
        pagesToStamp.push({ page: pageIndex, landscape: false });

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
        doc.setFontSize(12);
        doc.setTextColor(...pal.headingCol);
        doc.text(pal.isCRT ? '4.0 NUMERICAL VERIFICATION & AUDIT TRAIL' : '4. NUMERICAL VERIFICATION & AUDIT TRAIL', 14, 22);

        doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(...pal.dimTextCol);
        doc.text('Independent validation checks evaluating derivatives, energy conservation, limiting cases, and tolerances.', 14, 27);

        // Run checks
        const checkResults = (M.checks || []).map((c, i) => {
          let r;
          try { r = c.run(P); } catch (e) { r = { pass: false, value: NaN, detail: e.message }; }
          const ok = r.pass ?? (Math.abs(r.value) <= r.limit);
          return { num: i + 1, title: c.title, tex: c.tex, value: r.value, limit: r.limit, unitTex: r.unitTex, ok };
        });

        const totalChecks = checkResults.length;
        const passedChecks = checkResults.filter(c => c.ok).length;

        // Build HTML table card to capture cleanly with KaTeX formulas
        const auditCard = document.createElement('div');
        auditCard.style.padding = '20px 24px';
        auditCard.style.boxSizing = 'border-box';
        auditCard.style.background = pal.cardHtmlBg;
        auditCard.style.color = pal.cardHtmlText;
        auditCard.style.fontFamily = pal.isCRT ? 'Share Tech Mono, Roboto Mono, monospace' : 'Roboto, Arial, sans-serif';

        // Summary banner
        const sumBanner = document.createElement('div');
        sumBanner.style.display = 'flex';
        sumBanner.style.justifyContent = 'space-between';
        sumBanner.style.alignItems = 'center';
        sumBanner.style.padding = '12px 18px';
        sumBanner.style.marginBottom = '16px';
        sumBanner.style.background = pal.isCRT
          ? (passedChecks === totalChecks ? '#062817' : '#2b0b0b')
          : (passedChecks === totalChecks ? '#f0fdf4' : '#fef2f2');
        sumBanner.style.border = pal.isCRT
          ? (passedChecks === totalChecks ? '1.5px solid #22c55e' : '1.5px solid #ef4444')
          : (passedChecks === totalChecks ? '1.5px solid #86efac' : '1.5px solid #fca5a5');
        sumBanner.style.borderRadius = '6px';
        sumBanner.innerHTML = `
          <div>
            <div style="font-size:15px;font-weight:700;color:${passedChecks === totalChecks ? (pal.isCRT ? '#4ade80' : '#15803d') : '#ef4444'}">
              AUDIT VERDICT: ${passedChecks} / ${totalChecks} NUMERICAL MODULE CHECKS PASSED (${Math.round(passedChecks / (totalChecks || 1) * 100)}%)
            </div>
            <div style="font-size:11.5px;color:${pal.isCRT ? '#94a3b8' : '#475569'};margin-top:2px">
              Evaluated against ISO 2768-m geometric envelopes and analytic derivatives at active parameters.
            </div>
          </div>
          <div style="font-size:13px;font-weight:700;padding:6px 14px;border-radius:4px;background:${passedChecks === totalChecks ? (pal.isCRT ? '#166534' : '#16a34a') : '#dc2626'};color:#ffffff">
            ${passedChecks === totalChecks ? 'ALL PASSED' : 'CHECK FAILED'}
          </div>
        `;
        auditCard.append(sumBanner);

        // Verification Table
        const tbl = document.createElement('table');
        tbl.style.width = '100%';
        tbl.style.borderCollapse = 'collapse';
        tbl.style.fontSize = '11.5px';

        tbl.innerHTML = `
          <thead>
            <tr style="background:${pal.isCRT ? '#141c26' : '#0f244a'};color:${pal.isCRT ? '#ff9a2e' : '#ffffff'};text-align:left">
              <th style="padding:7px 8px;width:30px">#</th>
              <th style="padding:7px 8px">Verification Module & Criterion</th>
              <th style="padding:7px 8px">Formulation</th>
              <th style="padding:7px 8px">Observed Value</th>
              <th style="padding:7px 8px">Tolerance Limit</th>
              <th style="padding:7px 8px;text-align:center;width:60px">Verdict</th>
            </tr>
          </thead>
          <tbody>
            ${checkResults.map((c, i) => `
              <tr style="background:${pal.isCRT ? (i % 2 === 0 ? '#0e141d' : '#090d14') : (i % 2 === 0 ? '#ffffff' : '#f8fafc')};border-bottom:1px solid ${pal.isCRT ? '#1e293b' : '#e2e8f0'}">
                <td style="padding:6px 8px;font-weight:700;color:${pal.isCRT ? '#ff9a2e' : '#64748b'}">${c.num}</td>
                <td style="padding:6px 8px;font-weight:600;color:${pal.isCRT ? '#e2e8f0' : '#1e293b'}">${c.title}</td>
                <td style="padding:6px 8px;color:${pal.isCRT ? '#ffffff' : '#0f172a'}">${renderLatex(c.tex || '')}</td>
                <td style="padding:6px 8px;font-family:Roboto Mono, monospace;font-size:10.5px;color:${pal.isCRT ? '#4ade80' : '#0f172a'}">
                  ${fmtNum(c.value, 4)}${c.unitTex ? ' ' + renderLatex(c.unitTex) : ''}
                </td>
                <td style="padding:6px 8px;font-family:Roboto Mono, monospace;font-size:10.5px;color:${pal.isCRT ? '#94a3b8' : '#64748b'}">
                  ${c.limit != null ? (c.limit < 1e-4 ? c.limit.toExponential(1) : c.limit) : 'Identity'}
                </td>
                <td style="padding:6px 8px;text-align:center">
                  <span style="display:inline-block;padding:2px 8px;border-radius:3px;font-weight:700;font-size:10px;background:${c.ok ? (pal.isCRT ? '#06381e' : '#dcfce7') : (pal.isCRT ? '#450a0a' : '#fee2e2')};color:${c.ok ? (pal.isCRT ? '#4ade80' : '#15803d') : (pal.isCRT ? '#f87171' : '#b91c1c')};border:${pal.isCRT ? (c.ok ? '1px solid #16a34a' : '1px solid #dc2626') : 'none'}">
                    ${c.ok ? 'PASS' : 'FAIL'}
                  </span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        `;
        auditCard.append(tbl);

        // Load Margins from limits if available
        if (M.limits && M.limits.length) {
          const limSec = document.createElement('div');
          limSec.style.marginTop = '18px';
          limSec.innerHTML = `
            <div style="font-size:13px;font-weight:700;color:${pal.isCRT ? '#ff9a2e' : '#0f244a'};border-bottom:1px solid ${pal.isCRT ? '#ff9a2e' : '#cbd5e1'};padding-bottom:4px;margin-bottom:8px">
              STRUCTURAL & DYNAMIC OPERATING LIMITS AUDIT
            </div>
            <table style="width:100%;border-collapse:collapse;font-size:11px">
              <thead>
                <tr style="background:${pal.isCRT ? '#141c26' : '#f1f5f9'};color:${pal.isCRT ? '#ff9a2e' : '#334155'};text-align:left;border-bottom:1px solid ${pal.isCRT ? '#243040' : '#cbd5e1'}">
                  <th style="padding:6px 8px">Limit Descriptor</th>
                  <th style="padding:6px 8px">Criterion</th>
                  <th style="padding:6px 8px">Observed Peak</th>
                  <th style="padding:6px 8px">Safety Threshold</th>
                  <th style="padding:6px 8px">Utilisation</th>
                  <th style="padding:6px 8px;text-align:center">Margin Status</th>
                </tr>
              </thead>
              <tbody>
                ${M.limits.map((L, i) => {
                  const pk = L.peak ? L.peak(P) : Math.abs(L.value(W.S || {}, P));
                  const lim = L.limit(P);
                  const u = pk / (lim || 1);
                  const ok = u < 1.0;
                  return `
                    <tr style="background:${pal.isCRT ? (i % 2 === 0 ? '#0e141d' : '#090d14') : (i % 2 === 0 ? '#ffffff' : '#f8fafc')};border-bottom:1px solid ${pal.isCRT ? '#1e293b' : '#e2e8f0'}">
                      <td style="padding:6px 8px;font-weight:600;color:${pal.isCRT ? '#e2e8f0' : '#1e293b'}">${L.label}</td>
                      <td style="padding:6px 8px;color:${pal.isCRT ? '#ffffff' : '#0f172a'}">${renderLatex(L.tex || '')}</td>
                      <td style="padding:6px 8px;font-family:Roboto Mono, monospace;color:${pal.isCRT ? '#4ade80' : 'inherit'}">${fmtNum(pk, 2)} ${L.unit || ''}</td>
                      <td style="padding:6px 8px;font-family:Roboto Mono, monospace;color:${pal.isCRT ? '#94a3b8' : 'inherit'}">${fmtNum(lim, 2)} ${L.unit || ''}</td>
                      <td style="padding:6px 8px;font-family:Roboto Mono, monospace;font-weight:700;color:${u >= 1 ? '#ef4444' : u >= 0.85 ? '#f59e0b' : (pal.isCRT ? '#4ade80' : '#15803d')}">
                        ${Math.round(u * 100)} %
                      </td>
                      <td style="padding:6px 8px;text-align:center">
                        <span style="display:inline-block;padding:2px 8px;border-radius:3px;font-weight:700;font-size:10px;background:${ok ? (pal.isCRT ? '#06381e' : '#dcfce7') : (pal.isCRT ? '#450a0a' : '#fee2e2')};color:${ok ? (pal.isCRT ? '#4ade80' : '#15803d') : (pal.isCRT ? '#f87171' : '#b91c1c')};border:${pal.isCRT ? (ok ? '1px solid #16a34a' : '1px solid #dc2626') : 'none'}">
                          ${ok ? 'PASS' : 'EXCEEDED'}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          `;
          auditCard.append(limSec);
        }

        const auditImg = await cardToImage(html2canvas, auditCard, 2, pal);
        doc.addImage(auditImg, 'PNG', 14, 31, 182, 245);

        pageIndex++;
      }

      // =========================================================================
      // PAGE 6+: ALL KINEMATIC & DYNAMIC GRAPHS
      // =========================================================================
      if (opts.includeGraphs && M.graphs && M.graphs.length) {
        onStatus('Generating all simulation performance graphs...');
        const graphs = M.graphs;
        const perPage = 2;
        const numPages = Math.ceil(graphs.length / perPage);

        for (let gp = 0; gp < numPages; gp++) {
          addThemedPage('portrait');
          pagesToStamp.push({ page: pageIndex, landscape: false });

          doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
          doc.setFontSize(12);
          doc.setTextColor(...pal.headingCol);
          doc.text(pal.isCRT ? `5.0 PERFORMANCE SIMULATION GRAPHS (${gp + 1}/${numPages})` : `5. KINEMATIC & DYNAMIC PERFORMANCE GRAPHS (${gp + 1}/${numPages})`, 14, 22);

          doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(...pal.dimTextCol);
          doc.text('Closed-form evaluation across full motion cycle including parameter sweeps and harmonic variations.', 14, 27);

          const startIdx = gp * perPage;
          const pageGraphs = graphs.slice(startIdx, startIdx + perPage);

          let gy = 33;
          pageGraphs.forEach((gs, gi) => {
            // Graph header
            doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'bold');
            doc.setFontSize(9.5);
            doc.setTextColor(...pal.headingCol);
            doc.text(`${gs.title || 'Simulation Curve'}`, 14, gy);

            // LaTeX series labels
            doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(...pal.dimTextCol);
            const seriesStr = gs.series.map(s => s.tex || '').join('  ·  ');
            doc.text(`Series: ${seriesStr}`, 14, gy + 4.5);

            // Render high-res print plot
            const plotImg = renderPrintPlot(gs, P, pal.isCRT);
            doc.setDrawColor(...pal.borderCol);
            doc.setLineWidth(0.4);
            doc.rect(14, gy + 6.5, 182, 98, pal.isCRT ? 'FD' : 'S');
            doc.addImage(plotImg, 'PNG', 14.5, gy + 7, 181, 97);

            // Explanatory note
            if (gs.note) {
              doc.setFont(pal.isCRT ? 'Courier' : 'Helvetica', 'italic');
              doc.setFontSize(7.5);
              doc.setTextColor(...pal.dimTextCol);
              const cleanNote = gs.note.replace(/<[^>]+>/g, '').replace(/\$([^$]+)\$/g, '$1');
              const noteLines = doc.splitTextToSize(cleanNote, 182);
              doc.text(noteLines, 14, gy + 109);
            }

            gy += 122;
          });

          pageIndex++;
        }
      }

      // Stamp headers, footers, and page numbers across all pages
      const totalPages = pagesToStamp.length;
      pagesToStamp.forEach(p => {
        doc.setPage(p.page);
        stampHeaderFooter(doc, p.page, totalPages, M.title || W.project, p.landscape, pal);
      });

      // Save PDF file
      onStatus(pal.isCRT ? 'Finalizing CRT Phosphor Dossier and saving...' : 'Finalizing PDF package and saving...');
      const fileName = pal.isCRT ? `${W.project}_crt_dossier.pdf` : `${W.project}_engineering_report.pdf`;
      if (opts.download !== false) {
        doc.save(fileName);
      }
      WP.emit?.('log', 'c', 'REPORT', pal.isCRT ? 'CRT dossier exported' : 'Engineering report exported', fileName);
      onStatus(`Report exported: ${fileName}`);
      const dataURL = opts.dataURL ? doc.output('datauristring') : null;
      return { success: true, fileName, pages: totalPages, dataURL, isCRT: pal.isCRT };
    } finally {
      // Restore parameters
      if (opts.mode && M.modes) {
        WP.setParams(savedP);
      }
    }
  }

  // =========================================================================
  // UI INTEGRATION: REPORT PANEL & OPERATING MODE PANEL OPTIONS
  // =========================================================================
  function renderReportPanel() {
    const W = WP._, M = W.model;
    const body = WP._wm ? WP._wm('report') : null;
    if (!body) return;
    body.innerHTML = '';

    const h = (tag, attrs = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      children.flat(Infinity).forEach(c => {
        if (c == null || c === false) return;
        el.append(typeof c === 'string' ? document.createTextNode(c) : c);
      });
      return el;
    };

    const container = h('div', { class: 'wp-report' });

    // Intro note
    container.append(h('p', {
      class: 'wp-note',
      text: 'Generate a publication-grade PDF engineering report with high-resolution 3D assembly views, ISO 128 orthographic 6-view layout, LaTeX governing equations, 13 verification audit checks, and all performance graphs.'
    }));

    // Options form
    const form = h('div', { class: 'wp-report-opts' });

    // Report Theme Dropdown (Supports CRT Mode!)
    const curTheme = document.documentElement.dataset.theme || 'blueprint';
    const themeOpts = [
      ['auto', `Auto (Follow Active Theme: ${curTheme.toUpperCase()})`],
      ['crt', 'CRT Console (Phosphor Amber & Green Dark Mode)'],
      ['light', 'Standard Technical (White Paper)'],
    ];
    const themeSel = h('select', { class: 'wp-select', id: 'wp-rep-theme' },
      themeOpts.map(([v, l]) => h('option', { value: v, text: l }))
    );
    form.append(h('label', { class: 'wp-field', style: 'grid-template-columns:9rem 1fr;margin-bottom:.6rem' },
      h('span', { text: 'Report Styling' }), themeSel
    ));

    // Mode selection dropdown
    const modeOpts = [['', 'Active Custom Parameters (Current Sliders)']];
    (M.modes || []).forEach(m => modeOpts.push([m.id, `${m.label} (${m.note || 'Preset'})`]));

    const modeSel = h('select', { class: 'wp-select', id: 'wp-rep-mode' },
      modeOpts.map(([v, l]) => h('option', { value: v, text: l }))
    );
    form.append(h('label', { class: 'wp-field', style: 'grid-template-columns:9rem 1fr;margin-bottom:.6rem' },
      h('span', { text: 'Operating Profile' }), modeSel
    ));

    // Projection dropdown
    const projSel = h('select', { class: 'wp-select', id: 'wp-rep-proj' },
      [['first', 'First-angle (ISO 5456-2, Europe)'], ['third', 'Third-angle (US, Canada, Australia)']].map(([v, l]) => h('option', { value: v, text: l }))
    );
    form.append(h('label', { class: 'wp-field', style: 'grid-template-columns:9rem 1fr;margin-bottom:.8rem' },
      h('span', { text: 'Drawing Projection' }), projSel
    ));
